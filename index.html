<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#1b1410">
<title>三國誌·像素傳</title>
<style>
:root{--fs:17px;--bg:#1b1410;--bg2:#2a1f18;--bg3:#3a2a20;--ink:#f6ecd0;--dim:#b9a98a;--gold:#d9a93a;--red:#b8322a;--redl:#d8473a;--jade:#3fa6a0;--blue:#2f4a7a;--bd:#0d0907;--panel:#1f2630;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);font-family:"PingFang TC","PingFang HK","Heiti TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%;overflow:hidden;}
body{background:radial-gradient(ellipse at top,#2b1f17 0,#120d0a 80%);}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
canvas{image-rendering:-webkit-optimize-contrast;image-rendering:-moz-crisp-edges;image-rendering:crisp-edges;image-rendering:pixelated;}
#app{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;height:100%;max-width:1180px;margin:0 auto;padding:var(--sat) var(--sar) 0 var(--sal);position:relative;}
#top{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:6px;padding:6px 8px;background:#2a1a12;border-bottom:3px solid #0d0907;box-shadow:0 3px 0 #6a4630;-webkit-flex:0 0 auto;flex:0 0 auto;z-index:5;}
#pbadge{width:36px;height:36px;border:2px solid var(--gold);background:#333;-webkit-flex:0 0 auto;flex:0 0 auto;}
#pbadge canvas{width:100%;height:100%;display:block;}
#tinfo{-webkit-flex:1;flex:1;min-width:0;line-height:1.25;}
#tdate{font-size:12px;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#ttitle{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#tbtns{display:-webkit-flex;display:flex;gap:4px;-webkit-flex:0 0 auto;flex:0 0 auto;}
.ib{min-width:38px;height:36px;padding:0 6px;border:0;background:#5a3a24;color:var(--ink);font-size:16px;cursor:pointer;box-shadow:inset -2px -2px 0 #2e1c10,inset 2px 2px 0 #8a5a36;border-radius:0;}
.ib:active{background:#7a4a2c;}
#main{display:-webkit-flex;display:flex;-webkit-flex:1;flex:1;min-height:0;}
#col{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-flex:1;flex:1;min-width:0;min-height:0;}
#side{display:none;width:300px;-webkit-flex:0 0 300px;flex:0 0 300px;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#1a1410;border-left:3px solid #0d0907;padding:8px;}
@media (min-width:980px){#side{display:block;}}
#stagewrap{-webkit-flex:0 0 auto;flex:0 0 auto;display:-webkit-flex;display:flex;-webkit-justify-content:center;justify-content:center;background:#0d0907;padding:0;}
#stage{position:relative;width:100%;max-width:calc(34vh * 1.7778);}
#stage:before{content:"";display:block;padding-top:56.25%;}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block;}
#place{position:absolute;left:6px;top:6px;padding:2px 8px;background:rgba(20,12,8,.8);border:2px solid var(--gold);font-size:12px;color:var(--ink);}
#kindtag{position:absolute;right:6px;top:6px;padding:2px 8px;background:rgba(120,30,24,.9);border:2px solid #f0cf6a;font-size:12px;display:none;}
#story{-webkit-flex:1;flex:1;min-height:60px;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:6px 6px 0;padding:8px 10px;background:var(--panel);border:3px solid var(--gold);box-shadow:0 0 0 3px var(--bd),inset 0 0 0 2px #0d0907;position:relative;}
#spk{display:none;-webkit-align-items:center;align-items:center;gap:8px;margin-bottom:6px;}
#spk canvas{width:56px;height:56px;border:2px solid var(--gold);background:#333;-webkit-flex:0 0 auto;flex:0 0 auto;}
#spname{font-weight:bold;color:var(--gold);font-size:calc(var(--fs) + 1px);}
#spsub{font-size:12px;color:var(--dim);}
#txt{font-size:var(--fs);line-height:1.7;white-space:pre-wrap;word-break:break-word;}
#txt .fx{color:#9fe0a0;font-size:.88em;}
#txt .hd{color:var(--gold);font-weight:bold;}
#txt .say{color:#ffe9b0;}
#txt .ai{color:#8fd3ff;}
#aitag{display:none;font-size:11px;color:#8fd3ff;margin-bottom:4px;}
#skip{position:absolute;right:6px;bottom:4px;font-size:11px;color:var(--dim);display:none;}
#bottom{-webkit-flex:0 1 auto;flex:0 1 auto;max-height:44%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 6px 0;}
#choices{display:grid;grid-template-columns:1fr;gap:6px;}
@media (min-width:560px){#choices{grid-template-columns:1fr 1fr;}}
.glab{grid-column:1/-1;font-size:12px;color:var(--gold);margin-top:2px;padding-left:4px;border-left:3px solid var(--red);}
.cbtn{display:block;width:100%;text-align:left;padding:9px 10px;min-height:42px;background:#3a2a20;border:0;color:var(--ink);font-size:calc(var(--fs) - 1px);line-height:1.35;cursor:pointer;box-shadow:inset -3px -3px 0 #1e130c,inset 3px 3px 0 #7a5236,0 0 0 2px #0d0907;border-radius:0;}
.cbtn:active,.cbtn:hover{background:#5a3a24;}
.cbtn.ai{background:#1f3a4a;box-shadow:inset -3px -3px 0 #0c1c26,inset 3px 3px 0 #3a7a9a,0 0 0 2px #0d0907;}
.cbtn.back{background:#2a2a30;box-shadow:inset -3px -3px 0 #141418,inset 3px 3px 0 #5a5a68,0 0 0 2px #0d0907;}
.cbtn.pk{padding:8px 8px;}
#freebox{-webkit-flex:0 0 auto;flex:0 0 auto;display:-webkit-flex;display:flex;gap:6px;padding:6px 6px calc(6px + var(--sab));}
#free{-webkit-flex:1;flex:1;min-width:0;height:42px;padding:0 10px;font-size:16px;background:#141a22;border:3px solid #6a4630;border-radius:0;color:var(--ink);-webkit-appearance:none;appearance:none;outline:0;}
#free:focus{border-color:var(--gold);}
.gobtn{height:42px;padding:0 12px;border:0;background:var(--red);color:#fff;font-size:15px;box-shadow:inset -3px -3px 0 #6a1a16,inset 3px 3px 0 #e8685a,0 0 0 2px #0d0907;cursor:pointer;border-radius:0;white-space:nowrap;}
.gobtn.alt{background:#3a5a8a;box-shadow:inset -3px -3px 0 #1c2c4a,inset 3px 3px 0 #6a90c0,0 0 0 2px #0d0907;}
.gobtn.sm{height:34px;font-size:14px;padding:0 10px;}
.gobtn.dark{background:#4a3a2e;box-shadow:inset -3px -3px 0 #231a12,inset 3px 3px 0 #7a6552,0 0 0 2px #0d0907;}
/* overlay / modal */
.ov{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(5,3,2,.82);z-index:20;display:none;-webkit-align-items:stretch;align-items:stretch;-webkit-justify-content:center;justify-content:center;padding:var(--sat) var(--sar) var(--sab) var(--sal);}
.ov.on{display:-webkit-flex;display:flex;}
.box{width:100%;max-width:760px;margin:6px;background:#241a14;border:3px solid var(--gold);box-shadow:0 0 0 3px var(--bd);display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;min-height:0;}
.bhead{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:4px;padding:6px;background:#3a2218;border-bottom:3px solid #0d0907;-webkit-flex:0 0 auto;flex:0 0 auto;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.tab{-webkit-flex:0 0 auto;flex:0 0 auto;padding:7px 10px;border:0;background:#4a3020;color:var(--dim);font-size:14px;cursor:pointer;border-radius:0;white-space:nowrap;box-shadow:inset -2px -2px 0 #24160c,inset 2px 2px 0 #6a4630;}
.tab.on{background:var(--red);color:#fff;box-shadow:inset -2px -2px 0 #6a1a16,inset 2px 2px 0 #e8685a;}
.bbody{-webkit-flex:1;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px;font-size:15px;line-height:1.6;}
.sec{margin:0 0 12px;padding:8px;background:#1a120d;border:2px solid #4a3020;}
.sec h4{margin:0 0 6px;color:var(--gold);font-size:15px;}
.row{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:8px;margin:4px 0;}
.row>label{-webkit-flex:0 0 7.5em;flex:0 0 7.5em;font-size:14px;color:#ddd0b0;}
.row.st{margin:3px 0;}
.bar{-webkit-flex:1;flex:1;height:10px;background:#0d0907;border:1px solid #5a4030;position:relative;min-width:40px;}
.bar i{position:absolute;left:0;top:0;bottom:0;display:block;}
.num{font-size:13px;min-width:2.2em;text-align:right;color:var(--ink);}
.hint{font-size:12px;color:var(--dim);line-height:1.5;}
.pill{display:inline-block;padding:1px 7px;margin:2px 3px 2px 0;background:#3a2a20;border:1px solid #6a4630;font-size:12px;}
.field{width:100%;height:40px;padding:0 8px;font-size:16px;background:#141a22;border:2px solid #6a4630;color:var(--ink);border-radius:0;-webkit-appearance:none;appearance:none;}
select.field{background-image:none;}
textarea.field{height:110px;padding:6px 8px;font-size:13px;line-height:1.4;}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:22px;background:transparent;}
input[type=range]::-webkit-slider-runnable-track{height:8px;background:#0d0907;border:1px solid #6a4630;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:22px;background:var(--gold);border:2px solid #0d0907;margin-top:-8px;}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--red);}
.slot{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:6px;flex-wrap:wrap;padding:6px;margin-bottom:6px;background:#1a120d;border:2px solid #4a3020;}
.slot .m{-webkit-flex:1 1 160px;flex:1 1 160px;font-size:13px;line-height:1.4;}
.rrow{display:-webkit-flex;display:flex;gap:8px;padding:6px;margin-bottom:5px;background:#1a120d;border:2px solid #4a3020;cursor:pointer;-webkit-align-items:center;align-items:center;}
.rrow canvas{width:44px;height:44px;-webkit-flex:0 0 auto;flex:0 0 auto;border:2px solid #6a4630;}
.rrow .nm{font-size:15px;}.rrow .sb{font-size:12px;color:var(--dim);}
.rd{padding:6px 8px 8px;margin:-4px 0 6px;background:#150e0a;border:2px solid #4a3020;border-top:0;font-size:13px;}
.mem{font-size:12px;color:#c9b88e;padding-left:8px;border-left:2px solid #6a4630;margin:3px 0;}
.opt{display:inline-block;margin:3px 4px 3px 0;padding:8px 10px;border:0;background:#3a2a20;color:var(--ink);font-size:14px;cursor:pointer;border-radius:0;box-shadow:inset -2px -2px 0 #1e130c,inset 2px 2px 0 #7a5236;}
.opt.on{background:var(--red);box-shadow:inset -2px -2px 0 #6a1a16,inset 2px 2px 0 #e8685a;}
.opt.dis{opacity:.35;pointer-events:none;}
.title-screen{text-align:center;padding:10px;}
.title-screen h1{font-size:34px;letter-spacing:6px;margin:6px 0 2px;color:var(--gold);text-shadow:3px 3px 0 #7e1f1b,5px 5px 0 #000;}
.title-screen .sub{color:var(--dim);font-size:13px;margin-bottom:10px;}
.mbtns{display:grid;gap:8px;max-width:300px;margin:12px auto;}
#toast{position:fixed;left:50%;bottom:calc(70px + var(--sab));-webkit-transform:translateX(-50%);transform:translateX(-50%);max-width:92%;padding:8px 14px;background:rgba(10,6,4,.95);border:3px solid var(--gold);color:var(--ink);font-size:14px;z-index:60;display:none;white-space:pre-wrap;line-height:1.5;}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.statrow{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:6px;margin:3px 0;}
.statrow label{width:3.2em;font-size:14px;}.statrow b{width:2.2em;text-align:center;}
.smallb{width:30px;height:30px;border:0;background:#5a3a24;color:var(--ink);font-size:18px;box-shadow:inset -2px -2px 0 #2e1c10,inset 2px 2px 0 #8a5a36;border-radius:0;}
.fwarn{color:#ff9a8a;font-size:13px;}
.mapbox{position:relative;width:100%;height:230px;background:#16282a;border:2px solid #4a3020;overflow:hidden;}
.mapbox .pt{position:absolute;-webkit-transform:translate(-50%,-50%);transform:translate(-50%,-50%);text-align:center;font-size:11px;line-height:1.1;white-space:nowrap;}
.mapbox .pt i{display:block;width:12px;height:12px;margin:0 auto 1px;border:2px solid #0d0907;}
.mapbox .you i{outline:2px solid #fff;}
@media (max-width:420px){.row>label{-webkit-flex-basis:6em;flex-basis:6em;}.title-screen h1{font-size:28px;}}
.hot{position:absolute;display:block;padding:0;margin:0;border:2px solid transparent;background:transparent;cursor:pointer;-webkit-appearance:none;appearance:none;border-radius:0;color:#fff;font-size:11px;text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}
.hot span{position:absolute;left:50%;bottom:100%;font-size:10px;-webkit-transform:translateX(-50%);transform:translateX(-50%);white-space:nowrap;padding:0 4px;background:rgba(20,10,5,.78);border:1px solid #d9a93a;opacity:.92;pointer-events:none}
.hot:hover,.hot:active,.hot.on{border-color:#f0cf6a;background:rgba(255,230,120,.18)}
.hot:hover span,.hot:active span,.hot.on span{opacity:1}
#hots{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none}
#hots .hot{pointer-events:auto}
.tagrow{margin:4px 0}
.ach{display:-webkit-flex;display:flex;gap:8px;padding:6px;margin-bottom:5px;background:#1a120d;border:2px solid #4a3020}
.ach.lock{opacity:.45}
.ach b{color:#d9a93a}
.shopitem{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:8px;padding:6px;margin-bottom:5px;background:#1a120d;border:2px solid #4a3020}

/* ===== 古風皮膚 v3：金邊卷軸、紅木按鈕、轉場與入場動畫 ===== */
#top{background:linear-gradient(180deg,#3a2216 0,#24150d 100%);border-bottom:3px solid #0d0907;box-shadow:0 3px 0 #6a4630,0 5px 0 #d9a93a55;}
#pbadge{display:none;box-shadow:0 0 0 2px #0d0907,0 0 0 4px #6a4630;}
#stagewrap{background:#0d0907;border-bottom:3px solid #d9a93a;box-shadow:0 2px 0 #0d0907,0 4px 0 #6a4630;}
#stage{box-shadow:0 0 0 3px #0d0907,0 0 0 5px #d9a93a,0 0 0 7px #0d0907;}
#story{background:linear-gradient(180deg,#2a323f 0,#1e2531 55%,#1a2029 100%);border:3px solid #d9a93a;box-shadow:0 0 0 2px #0d0907,0 0 0 4px #6a4630,inset 0 0 0 2px #0d0907,inset 0 0 0 3px #8a6a22,inset 0 0 22px rgba(0,0,0,.55);}
#spk canvas{border:2px solid #f0cf6a;box-shadow:0 0 0 2px #0d0907,0 0 0 4px #7a2a1e;}
#spname{text-shadow:1px 1px 0 #000;letter-spacing:1px;}
#spname:before{content:"◆ ";color:var(--red);}
#place{background:linear-gradient(180deg,#4a1e16,#2a0f0a);border:2px solid #f0cf6a;box-shadow:0 0 0 1px #0d0907;letter-spacing:1px;}
#txt .cur{color:#f0cf6a;animation:blink 0.8s steps(2,start) infinite;}
@-webkit-keyframes blink{to{visibility:hidden}}
@keyframes blink{to{visibility:hidden}}
.cbtn{border-radius:0;-webkit-appearance:none;appearance:none;background:linear-gradient(180deg,#74301f 0,#52221a 55%,#431b13 100%);color:#fbeed0;border-left:0;box-shadow:inset 0 0 0 1px rgba(240,207,106,.35),inset -3px -3px 0 #2a0f0a,inset 3px 3px 0 #a0523a,0 0 0 2px #0d0907;text-shadow:1px 1px 0 #1a0a06;-webkit-animation:optIn .3s ease-out both;animation:optIn .3s ease-out both;}
.cbtn:hover,.cbtn:active{background:linear-gradient(180deg,#8a3a26 0,#64291e 100%);}
.cbtn:nth-child(2){-webkit-animation-delay:.04s;animation-delay:.04s}.cbtn:nth-child(3){-webkit-animation-delay:.08s;animation-delay:.08s}
.cbtn:nth-child(4){-webkit-animation-delay:.12s;animation-delay:.12s}.cbtn:nth-child(5){-webkit-animation-delay:.16s;animation-delay:.16s}
.cbtn:nth-child(6){-webkit-animation-delay:.2s;animation-delay:.2s}.cbtn:nth-child(7){-webkit-animation-delay:.24s;animation-delay:.24s}
.cbtn:nth-child(8){-webkit-animation-delay:.28s;animation-delay:.28s}.cbtn:nth-child(n+9){-webkit-animation-delay:.32s;animation-delay:.32s}
@-webkit-keyframes optIn{from{opacity:0;-webkit-transform:translateY(8px)}to{opacity:1;-webkit-transform:none}}
@keyframes optIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.glab{color:#f0cf6a;border-left:3px solid var(--red);letter-spacing:1px;}
.gobtn{background:linear-gradient(180deg,#c8423a,#8a241c);}
.ib{background:linear-gradient(180deg,#6a4630,#4a2c1c);}
.box{border:3px solid #d9a93a;box-shadow:0 0 0 3px var(--bd),0 0 0 5px #6a4630,inset 0 0 0 2px #0d0907;background:linear-gradient(180deg,#2a1f18,#201610);}
.bhead{background:linear-gradient(180deg,#4a2a1c,#2e1a10);}
.sec{border:2px solid #5a4030;box-shadow:inset 0 0 0 1px #0d0907,inset 0 0 0 2px #3a2a1a;}
.sec h4{border-bottom:1px solid #6a4630;padding-bottom:3px;letter-spacing:1px;}
.tab.on,.opt.on{background:linear-gradient(180deg,#c8423a,#8a241c);}
#cv.wipe{-webkit-animation:wipeIn .55s ease-out both;animation:wipeIn .55s ease-out both;}
@-webkit-keyframes wipeIn{from{-webkit-clip-path:inset(0 100% 0 0);clip-path:inset(0 100% 0 0);opacity:.4}to{-webkit-clip-path:inset(0 0 0 0);clip-path:inset(0 0 0 0);opacity:1}}
@keyframes wipeIn{from{-webkit-clip-path:inset(0 100% 0 0);clip-path:inset(0 100% 0 0);opacity:.4}to{-webkit-clip-path:inset(0 0 0 0);clip-path:inset(0 0 0 0);opacity:1}}
#cv.fade{-webkit-animation:fadeIn .45s ease-out both;animation:fadeIn .45s ease-out both;}
@-webkit-keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#story.pop{-webkit-animation:storyIn .3s ease-out both;animation:storyIn .3s ease-out both;}
@-webkit-keyframes storyIn{from{opacity:.2;-webkit-transform:translateY(5px)}to{opacity:1;-webkit-transform:none}}
@keyframes storyIn{from{opacity:.2;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.cbtn,#cv.wipe,#cv.fade,#story.pop{-webkit-animation:none;animation:none}}
body.noanim .cbtn,body.noanim #cv.wipe,body.noanim #cv.fade,body.noanim #story.pop{-webkit-animation:none;animation:none}
@media (max-width:420px){#stage{box-shadow:0 0 0 2px #0d0907,0 0 0 4px #d9a93a,0 0 0 6px #0d0907;}}

#aibar{display:none;-webkit-flex:0 0 auto;flex:0 0 auto;-webkit-align-items:center;align-items:center;gap:6px;margin:4px 6px 0;padding:5px 8px;background:#3a1a14;border:2px solid #c0503a;color:#ffd9cf;font-size:13px;line-height:1.45;z-index:6;max-height:30vh;overflow-y:auto;}
#aibar.wait{background:#1d2a3a;border-color:#4a7aa8;color:#cfe6ff;}
#aibar #aibarmsg{-webkit-flex:1;flex:1;white-space:pre-wrap;word-break:break-all;}
#aibar .aibtn{-webkit-flex:0 0 auto;flex:0 0 auto;background:#241812;color:#f1e3c4;border:2px solid #8a6a22;font-size:13px;padding:3px 8px;min-height:30px;min-width:32px;font-family:inherit;cursor:pointer;}

/* ===== V4 橫向場景 UI：木框＋卷軸紙感 HUD ===== */
#stage{--u:6px;max-width:calc(52vh * 1.7778);font-size:calc(var(--u)*2.1);}
#hudL{position:absolute;left:calc(var(--u)*1.2);top:calc(var(--u)*1.2);display:-webkit-flex;display:flex;gap:calc(var(--u)*.8);padding:calc(var(--u)*.7) calc(var(--u)*1.2) calc(var(--u)*.7) calc(var(--u)*.7);background:linear-gradient(180deg,#f0e2bc,#dcc89a);border:calc(var(--u)*.45) solid #5a3a22;box-shadow:0 0 0 1px #c8a460 inset,0 2px 0 rgba(0,0,0,.4);color:#3a2814;z-index:3;pointer-events:none;min-width:calc(var(--u)*24);}
#hudpw{width:calc(var(--u)*7);height:calc(var(--u)*7);border-radius:50%;border:calc(var(--u)*.4) solid #5a3a22;overflow:hidden;background:#889;-webkit-flex:0 0 auto;flex:0 0 auto;box-shadow:0 0 0 1px #d9a93a;}
#hudp{width:100%;height:100%;display:block;}
#hudL .hb{min-width:0;-webkit-flex:1;flex:1;}
#hudn{font-weight:bold;white-space:nowrap;font-size:1em;line-height:1.15;}

 S.seed=(S.seed+0x6D2B79F5)|0;var t=S.seed;

 return((t^(t>>>14))>>>0)/4294967296;
}

function ymd(day){var y=184+Math.floor(day/360);var r=day%360;return {y:y,m:Math.floor(r/30)+1,d:r%30+1};}
function dayOf(y,m,d){return (y-184)*360+(m-1)*30+((d||1)-1);}
function eraStr(y){var e,n;if(y<=189){e='中平';n=y-183;}else if(y<=193){e='初平';n=y-189;}else if(y<=195){e='興平';n=y-193;}else{e='建安';n=y-195;}
 var cn=['','元','二','三','四','五','六','七','八','九','十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','二十一','二十二','二十三','二十四','二十五'];return e+cn[n]+'年';}
function dateStr(day){var o=ymd(day==null?S.day:day);return eraStr(o.y)+o.m+'月';}
function dateFull(day){var o=ymd(day==null?S.day:day);return '公元'+o.y+'年·'+eraStr(o.y)+o.m+'月'+o.d+'日';}
function mIdx(y,m){return y*12+m-1;}
function parseYM(s){var a=s.split('-');return {y:+a[0],m:+a[1]};}
function curM(){var o=ymd(S.day);return mIdx(o.y,o.m);}
function atLeast(s){var o=parseYM(s);return curM()>=mIdx(o.y,o.m);}
function curYear(){return ymd(S.day).y;}

 for(var i=0;i<parts.length;i++){var p=parts[i];if(p.indexOf(':')<0)continue;var kv=p.split(':');var t=parseYM(kv[0]);if(cm>=mIdx(t.y,t.m))res=kv[1];}
 return res;
}

function R(id){
 var r=S.rel[id];
 if(!r){r={tr:10,af:5,su:6,ha:0,lo:0,ly:0,fe:0,re:5,met:0,mem:[],last:0,vis:0};
  var n=NPC[id];if(n){if(facOf(id)===S.p.fac&&S.p.fac!=='none'){r.tr+=8;r.su-=3;}
   var fr=facHostility(facOf(id),S.p.fac);if(fr<-40){r.su+=10;r.tr-=5;}
   r.re=clamp(5+n.fame/8,0,40);}
  S.rel[id]=r;}
 return r;
}
function facHostility(a,b){if(a===b)return 50;return S.facrel[a+'>'+b]!==undefined?S.facrel[a+'>'+b]:(S.facrel[b+'>'+a]!==undefined?S.facrel[b+'>'+a]:0);}
function addRel(id,dim,d,memo){
 if(!NPC[id]||!alive(id)&&dim!=='ha')return;
 var r=R(id);if(window.skLv&&d>0&&(dim==='af'||dim==='tr'))d+=skLv('charm')*(dim==='af'?1:0)+(skLv('orator')>0&&dim==='tr'?skLv('orator'):0);
 r[dim]=clamp(Math.round(r[dim]+d),0,100);
 if(dim==='ha'&&d>8)r.af=clamp(r.af-Math.round(d/2),0,100);
 if(dim==='af'&&d>8)r.su=clamp(r.su-2,0,100);
 if(dim==='su'&&d>10)r.tr=clamp(r.tr-Math.round(d/3),0,100);
 if(memo)addMem(id,memo);
}
function addMem(id,t){var r=R(id);r.mem.push({d:S.day,t:t});if(r.mem.length>14)r.mem.splice(0,r.mem.length-14);}
function regard(id){var r=R(id);return Math.round((r.tr+r.af+r.ly*0.6+r.re*0.5+r.lo*0.3-r.su-r.ha*1.4-r.fe*0.2)/3.4);}
function relLabel(id){
 var r=R(id);
 if(r.ha>=60)return '仇視';if(r.lo>=70)return '傾心';if(r.fe>=60)return '畏懼';if(r.su>=65)return '猜忌';
 if(r.ly>=70)return '效忠';if(r.tr>=70&&r.af>=60)return '知己';if(r.af>=60)return '親近';if(r.tr>=55)return '信賴';if(r.su>=40)return '戒備';if(r.re>=45)return '敬重';
 if(!r.met)return '未識';return '尋常';
}
function nameRank(id){return nm(id);}

/* ---- 紀錄 ---- */
function addLog(t){S.log.push({d:S.day,t:t});if(S.log.length>300)S.log.shift();}
function addNews(t){S.news.push({d:S.day,t:t});if(S.news.length>40)S.news.shift();addLog('〔傳聞〕'+t);}

/* ---- 效果應用 ---- */
var AI_CLAMP={st:8,gold:300,hp:25,rel:15,days:45,fac:5,sus:30};
function applyFx(fx,src){
 if(!fx)return[];
 var out=[];var ai=(src==='ai');
 var st=fx.st;
 if(st){for(var k in st){if(S.p.st[k]===undefined)continue;var d=+st[k];if(isNaN(d))continue;
   if(ai){var lim=(k==='gold')?AI_CLAMP.gold:(k==='hp'?AI_CLAMP.hp:AI_CLAMP.st);d=clamp(d,-lim,lim);}
   if(d<0&&k==='hp'){d=Math.round(d*({easy:0.6,normal:0.85,hard:1.1,hell:1.4}[SET.diff]||1)*(window.dmgMul?dmgMul():1));if(d===0)d=-1;}
   var cap=(k==='gold')?999999:100;
   if(k==='wu'||k==='zhi'||k==='zheng'||k==='mei'||k==='tong'||k==='stealth'){cap=(k==='wu'&&S.flags.kh_done)?100:95;}
   var old=S.p.st[k];S.p.st[k]=clamp(Math.round(old+d),0,cap);var ch=S.p.st[k]-old;
   if(ch!==0&&k!=='merit')out.push(ST_NAMES[k]+(ch>0?'+':'')+ch);else if(ch!==0)out.push('功勳'+(ch>0?'+':'')+ch);}}
 if(fx.rel){for(var id in fx.rel){if(!NPC[id])continue;var o=fx.rel[id];for(var dm in o){if(REL_KEYS.indexOf(dm)<0)continue;var dd=+o[dm];if(isNaN(dd))continue;if(ai)dd=clamp(dd,-AI_CLAMP.rel,AI_CLAMP.rel);
   addRel(id,dm,dd);var rn=REL_DIMS[REL_KEYS.indexOf(dm)][1];out.push(nm(id)+rn+(dd>0?'+':'')+dd);}
   R(id).met=R(id).met||1;}}
 if(fx.mem){for(id in fx.mem){if(NPC[id])addMem(id,String(fx.mem[id]).slice(0,60));}}
 if(fx.sus){for(var i=0;i<fx.sus.length;i++){var sx=fx.sus[i];if(!NPC[sx[0]]||!NPC[sx[1]])continue;var sd=+sx[2];if(ai)sd=clamp(sd,-AI_CLAMP.sus,AI_CLAMP.sus);nrSus(sx[0],sx[1],sd);out.push(nm(sx[0])+'對'+nm(sx[1])+'的懷疑'+(sd>0?'+':'')+sd);}}
 if(fx.bond){for(i=0;i<fx.bond.length;i++){var bx=fx.bond[i];nrBond(bx[0],bx[1],+bx[2]);}}
 if(fx.flags){for(var f in fx.flags){var key=ai?'ai_'+f.replace(/[^\w]/g,''):f;S.flags[key]=fx.flags[f];}}
 if(fx.fac){for(f in fx.fac){if(!S.fac[f])continue;var fd=+fx.fac[f];if(ai)fd=clamp(fd,-AI_CLAMP.fac,AI_CLAMP.fac);S.fac[f].pw=clamp(S.fac[f].pw+fd,0,100);}}
 if(fx.item){for(var it in fx.item){if(!ITEMS[it])continue;S.p.items[it]=Math.max(0,(S.p.items[it]||0)+fx.item[it]);out.push(ITEMS[it].n+(fx.item[it]>0?'+':'')+fx.item[it]);}}
 if(fx.bounty){S.p.wanted=clamp(S.p.wanted+fx.bounty,0,100);if(fx.bounty>0)out.push('通緝度+'+fx.bounty);}
 if(fx.kh){S.p.kh=clamp(S.p.kh+fx.kh,0,100);}
 if(fx.q&&!ai){addQuest(fx.q);}
 if(fx.qdone)questState(fx.qdone,'done');
 if(fx.qfail)questState(fx.qfail,'fail');
 if(fx.news)addNews(fx.news);
 if(fx.log)addLog(fx.log);
 if(fx.npc&&!ai){for(id in fx.npc){if(S.npc[id])for(var kk in fx.npc[id])S.npc[id][kk]=fx.npc[id][kk];}}
 if(fx.loc&&REGIONS[fx.loc]){S.p.region=fx.loc;if(REGIONS[fx.loc].sub.indexOf(S.p.spot)<0)S.p.spot=REGIONS[fx.loc].sub[0];}
 if(fx.spot&&THEMES[fx.spot])S.p.spot=fx.spot;
 if(fx.assist){for(f in fx.assist){S.assist[f]=(S.assist[f]||0)+fx.assist[f];}}
 if(fx.kill&&!ai){killNpc(fx.kill,fx.cause||'身亡',fx.killer||null);}
 if(fx.days){var dy=+fx.days;if(ai)dy=clamp(dy,0,AI_CLAMP.days);if(dy>0)advance(dy);}
 return out;
}

/* ---- 任務 ---- */
function addQuest(q){
 for(var i=0;i<S.quests.length;i++){if(S.quests[i].id===q.id){if(S.quests[i].s==='active'){S.quests[i].d=q.d||S.quests[i].d;return;}}}
 S.quests.push({id:q.id,t:q.t,d:q.d||'',s:'active',day:S.day,type:q.type||'',a:q.a||null,due:q.due||0,rew:q.rew||null,giver:q.giver||''});
}
function questState(id,s){for(var i=0;i<S.quests.length;i++){var q=S.quests[i];if(q.id===id&&q.s==='active'){q.s=s;q.end=S.day;addLog('任務「'+q.t+'」'+(s==='done'?'完成':'失敗'));
 if(s==='done'&&q.rew){applyFx(q.rew);}}}}
function hasQuest(id){for(var i=0;i<S.quests.length;i++)if(S.quests[i].id===id)return S.quests[i].s;return '';}
function checkQuests(){
 for(var i=0;i<S.quests.length;i++){var q=S.quests[i];if(q.s!=='active'||!q.type)continue;
  if(q.type==='kill'&&!alive(q.a.t)){questState(q.id,(S.flags['killed_by_p_'+q.a.t])?'done':'fail');}
  else if(q.type==='sus'&&NR(q.a.a,q.a.b).su>=q.a.v){questState(q.id,'done');}
  else if(q.type==='rank'&&S.p.rank>=q.a.v){questState(q.id,'done');}
  else if(q.due&&S.day>q.due){questState(q.id,'fail');}}
}

/* ---- 時間 ---- */
function advance(days){
 for(var i=0;i<days;i++){S.day++;S.stat.days++;
  if(S.day%4===0){var h=S.p.st.hp;if(h<100&&h>0){S.p.st.hp=Math.min(100,h+(S.flags.resting?3:1)+(window.hpRegen?hpRegen():0));}}
  if(window.dayHook)dayHook();
  if(S.day%30===0)monthTick();
  if(S.day%360===0){S.p.age++;}}
 runQueue();
 directorMaybe();
}
function runQueue(){
 S.queue.sort(function(a,b){return a.due-b.due;});
 var guard=0;
 while(S.queue.length&&S.queue[0].due<=S.day&&guard++<60){
  var e=S.queue.shift();var h=QH[e.id];if(h){var sc=null;try{sc=h(e.a||{});}catch(err){if(window.console)console.error('queue handler',e.id,err);}if(sc)S.pending.push(sc);}}
}
function qpush(inDays,id,a){S.queue.push({due:S.day+inDays,id:id,a:a||{}});}
var QH={};

function monthTick(){
 // 到來的人物
 for(var i=0;i<NPCS.length;i++){var n=NPCS[i];var o=S.npc[n.id];
  if(o.a===0&&n.from&&atLeast(n.from)&&!S.flags['dead_'+n.id]&&!S.flags['gone_'+n.id]){o.a=1;}}
 // 俸祿
 var sal=0;var pp=S.p;
 if(pp.fac!=='none'&&S.fac[pp.fac]&&S.fac[pp.fac].pw>0){sal=6+pp.rank*9;}
 if(pp.path==='wander'){sal=0;}
 pp.st.gold+=sal-3;if(pp.st.gold<0)pp.st.gold=0;
 // 勢力演化
 worldSim();
 // 關係衰減
 for(var id in S.rel){var r=S.rel[id];if(r.su>0&&r.su<60)r.su=Math.max(0,r.su-1);if(r.ha>0&&r.ha<50)r.ha=Math.max(0,r.ha-0.5);if(r.fe>0)r.fe=Math.max(0,r.fe-1);
  if(S.day-r.last>90&&r.af>10){r.af=Math.max(10,r.af-0.5);}r.su=Math.round(r.su);r.ha=Math.round(r.ha*2)/2;}
 for(var k in S.nrel){var nr=S.nrel[k];if(nr.su>0)nr.su=Math.max(0,nr.su-0.7);}
 pp.wanted=Math.max(0,pp.wanted-2);
 // 威權：計算權勢
 computeInf();
 // 通緝
 if(pp.wanted>=45&&roll(pp.wanted*0.4)){S.pending.push(hunterScene());}
 checkQuests();
}
function computeInf(){
 var p=S.p;var f=0;for(var id in S.rel){var r=S.rel[id];if(r.ly>=60)f++;}
 var v=p.rank*9+Math.min(f,6)*4+p.st.rep*0.25+(S.flags.holdseal?10:0)+Math.min(30,(S.stat.kills||0)*2)+(p.st.merit/8);
 p.st.inf=clamp(Math.round(v),0,100);
}

/* ---- 勢力演化 ---- */
function worldSim(){
 var ids=FAC_ORDER.filter(function(f){return S.fac[f].on;});
 for(var i=0;i<ids.length;i++){var f=S.fac[ids[i]];f.pw=clamp(f.pw+(rand()-0.5)*1.4,0,100);}
 for(var k in S.facrel){var v=S.facrel[k];if(v<-35){var ab=k.split('>');var a=ab[0],b=ab[1];
   if(!S.fac[a]||!S.fac[b]||!S.fac[a].on||!S.fac[b].on)continue;
   if(roll(9)){var wa=S.fac[a].pw+rnd(20),wb=S.fac[b].pw+rnd(20);var win=wa>=wb?a:b,lose=win===a?b:a;
    S.fac[win].pw=clamp(S.fac[win].pw+1,0,100);S.fac[lose].pw=clamp(S.fac[lose].pw-1.3,0,100);
    if(roll(60)){addNews(FACTIONS[win].n+'與'+FACTIONS[lose].n+'交鋒，'+FACTIONS[win].n+'小勝。');}}}}
 // 勢力崩潰判定
 for(i=0;i<ids.length;i++){var fid=ids[i];if(fid==='han')continue;if(S.fac[fid].pw<=0.5&&fid!=='huangjin'){factionCollapse(fid);}}
 checkRifts();
 // 隨機傳聞
 if(roll(30)){var nws=NEWS_POOL;var t=pick(nws);addNews(fmt(t,{r1:RL(),r2:RL()}));}
}
function RL(){return REGIONS[pick(REGION_IDS)].n;}
var NEWS_POOL=['{r1}一帶大旱，流民四起。','{r1}有盜匪嘯聚，官府無力剿捕。','{r1}一場瘟疫蔓延，藥價飛漲。','{r1}商旅傳言：近日有名士隱居山中。','{r2}糧價暴漲，百姓怨聲載道。','洛陽市井傳言，宮中近日又有人暴斃。','有人說，最近夜裡常見黑影翻過{r1}城牆。','{r1}豪強兼併土地，農人流離失所。','{r2}大雨連月，河水泛濫。','坊間流傳一首童謠：「千里草，何青青；十日卜，不得生。」'];

function factionCollapse(fid){
 var f=S.fac[fid];f.on=0;f.pw=0;
 addNews(FACTIONS[fid].n+'勢力土崩瓦解，部眾四散。');
 for(var i=0;i<NPCS.length;i++){var n=NPCS[i];if(facOf(n.id)===fid&&alive(n.id)){S.npc[n.id].f='none';}}
 if(S.p.fac===fid){S.p.fac='none';S.p.title=titleOf();S.pending.push(scene('你所效力的勢力已然瓦解。主公生死不明，同袍星散，你一夜之間成了無依無靠的浪人。\n\n亂世之中，也許這正是新的開始。','',{bg:'wild',ch:[ch('繼續','hub')]}));}
}
function alivePersonsOf(fid){var r=[];for(var i=0;i<NPCS.length;i++){if(facOf(NPCS[i].id)===fid&&alive(NPCS[i].id))r.push(NPCS[i].id);}return r;}

/* ---- 內訌 ---- */
function checkRifts(){
 var keys=[];for(var k in S.nrel){if(S.nrel[k].su>=68)keys.push(k);}
 for(var i=0;i<keys.length;i++){var ab=keys[i].split('>');var a=ab[0],b=ab[1];if(!alive(a)||!alive(b))continue;
  var key='rift_'+keys[i];if(S.cd[key]&&S.day-S.cd[key]<120)continue;
  if(!roll(30+(S.nrel[keys[i]].su-68)))continue;
  S.cd[key]=S.day;resolveRift(a,b);}
}
function resolveRift(a,b){
 var na=NPC[a],nb=NPC[b];var fa=facOf(a),fb=facOf(b);
 var a_ruler=(S.fac[fa]&&S.fac[fa].ruler===a),b_ruler=(S.fac[fb]&&S.fac[fb].ruler===b);
 var txt;
 if(fa===fb&&fa!=='none'){
  if(b_ruler&&!a_ruler){ // 下克上
   var pwr=na.wu+na.amb*0.5+na.cru*0.3-nb.gd*0.5-nb.wu*0.3;
   if(roll(25+pwr*0.5)){txt=na.n+'因疑忌日深，趁機對'+nb.n+'下手，'+nb.n+'竟死於'+na.n+'之手！';killNpc(b,'為'+na.n+'所殺',a);addNews(txt);return;}
   else{txt=na.n+'謀害'+nb.n+'未遂，連夜出逃，投奔他處。';defect(a);addNews(txt);return;}
  } else if(a_ruler){ // 主殺臣
   if(roll(na.cru*0.8+na.sus*0.2)){txt=na.n+'疑心'+nb.n+'謀反，下令將其處死。';killNpc(b,'被'+na.n+'處死',a);addNews(txt);return;}
   txt=nb.n+'察覺'+na.n+'疑忌，棄官而去。';defect(b);addNews(txt);return;
  } else { // 同僚相爭
   if(roll(50)){txt=na.n+'與'+nb.n+'勢如水火，'+nb.n+'憤而出走。';defect(b);}else{txt=na.n+'與'+nb.n+'大打出手，雙方各折損人手。';S.fac[fa].pw=clamp(S.fac[fa].pw-2,0,100);}
   addNews(txt);return;}
 } else {
  S.facrel[fa+'>'+fb]=clamp((S.facrel[fa+'>'+fb]||0)-20,-100,100);
  txt=na.n+'與'+nb.n+'積怨爆發，'+FACTIONS[fa].n+'與'+FACTIONS[fb].n+'關係急遽惡化。';addNews(txt);}
}
function defect(id){
 var n=NPC[id];var cur=facOf(id);var best='none',bv=-999;
 for(var i=0;i<FAC_ORDER.length;i++){var f=FAC_ORDER[i];if(f===cur||!S.fac[f].on||f==='huangjin')continue;var v=S.fac[f].pw+facHostility(cur,f)*-0.2+rnd(15)-(S.fac[f].ruler&&NR(id,S.fac[f].ruler).su)*0.3;if(v>bv){bv=v;best=f;}}
 if(n.tier>=3&&roll(50))best='none';
 S.npc[id].f=best;
 if(best!=='none'){S.npc[id].l=FACTIONS[best].cap;}
 addNews(n.n+'改投'+(best==='none'?'他處，成為浪人':FACTIONS[best].n)+'。');
}

/* ---- 人物死亡 ---- */
function killNpc(id,cause,killer,silent){
 if(!alive(id))return;
 var o=S.npc[id];o.a=0;S.dead.push({id:id,day:S.day,cause:cause,by:killer||''});
 var n=NPC[id];S.flags['dead_'+id]=1;
 if(killer==='player'){S.flags['killed_by_p_'+id]=1;}
 var fid=o.f;
 addLog(n.n+'：'+cause);
 // 勢力影響
 if(S.fac[fid]&&fid!=='none'){S.fac[fid].pw=clamp(S.fac[fid].pw-(n.tier>=4?6:(n.tier===3?2.5:1)),0,100);}
 // 皇帝
 if(S.emp===id){nextEmperor();}
 // 繼任
 if(S.fac[fid]&&S.fac[fid].ruler===id&&fid!=='han'){succession(fid,id);}
 if(fid==='han'&&S.reg===id){S.reg=regentGuess();}
 // 友人之恨
 for(var i=0;i<NPCS.length;i++){var m=NPCS[i];if(!alive(m.id)||m.id===id)continue;var b=NR(m.id,id).b;
  if(b>=50&&killer&&killer!=='player'&&alive(killer)){nrSus(m.id,killer,25);NR(m.id,killer).b-=30;}}
 if(killer==='player'&&!silent){S.stat.kills++;
  // 世人是否知曉
  var known=roll(25+(S.p.wanted>0?10:0)-S.p.st.stealth*0.2);
  for(i=0;i<NPCS.length;i++){m=NPCS[i];if(!alive(m.id))continue;var bd=NR(m.id,id).b;
   if(bd>=40){if(known||m.id===id){addRel(m.id,'ha',Math.round(bd*0.6));addRel(m.id,'su',20);addMem(m.id,'聽說'+S.p.name+'與'+n.n+'之死有關。');}else{addRel(m.id,'su',6);}}
   else if(bd<=-40&&known){addRel(m.id,'tr',8);addRel(m.id,'re',8);}}
  S.p.wanted=clamp(S.p.wanted+(known?n.tier*12:n.tier*4),0,100);
  S.flags.known_killer_p=S.flags.known_killer_p||known;
  S.p.st.rep=clamp(S.p.st.rep+(known?n.tier*2:0),0,100);}
 if(!silent&&killer!=='player')S.news.push({d:S.day,t:n.n+'：'+cause});
 return true;
}
function regentGuess(){var c=['dongzhuo','lijue','caocao','hejin','zhangrang','wangyun','yangbiao'];for(var i=0;i<c.length;i++)if(alive(c[i]))return c[i];return '';}
function nextEmperor(){
 var l=['lingdi','shaodi','xiandi'];var i=l.indexOf(S.emp);var nx='';
 for(var j=i+1;j<l.length;j++){if(alive(l[j])){nx=l[j];break;}}
 if(!nx){for(j=0;j<l.length;j++)if(alive(l[j])){nx=l[j];}}
 if(nx){S.emp=nx;S.fac.han.ruler=nx;}else{S.emp='';S.fac.han.ruler='';S.fac.han.pw=Math.max(0,S.fac.han.pw-15);S.flags.han_fall=1;addNews('大漢天子已無，朝廷名存實亡！');}
}
function succession(fid,deadId){
 var f=FACTIONS[fid];var s=S.fac[fid];var nxt='';
 for(var i=0;i<f.heir.length;i++){if(alive(f.heir[i])&&facOf(f.heir[i])===fid){nxt=f.heir[i];break;}}
 if(!nxt){var ms=alivePersonsOf(fid).sort(function(a,b){return NPC[b].tier-NPC[a].tier||NPC[b].fame-NPC[a].fame;});if(ms.length)nxt=ms[0];}
 if(nxt){s.ruler=nxt;s.pw=clamp(s.pw*0.75,0,100);addNews(f.n+'群龍無首，'+nm(nxt)+'接掌其眾，勢力受挫。');}
 else{s.ruler='';factionCollapse(fid);}
}

/* ---- 稱號與職位 ---- */
function bossOf(){
 var pa=PATHS[S.p.path];var fac=S.p.fac;
 if(fac==='han'&&pa.boss.length){for(var i=0;i<pa.boss.length;i++){if(alive(pa.boss[i]))return pa.boss[i];}
  if(S.fac.han.ruler&&alive(S.fac.han.ruler))return S.fac.han.ruler;}
 if(fac==='han'&&S.emp)return S.emp;

 ids.sort(function(x,y){var sx=(locOf(x)===S.p.region?1000:0)+NPC[x].tier*10+NPC[x].fame/10;var sy=(locOf(y)===S.p.region?1000:0)+NPC[y].tier*10+NPC[y].fame/10;return sy-sx;});

var ENDINGS={
 top_master:{n:'天下第一',t:'你的名字，成了江湖與沙場上最令人色變的存在。\n呂布、關羽、典韋……無論多麼威名赫赫的猛將，在你面前都只是一聲嘆息。有人說你是從深宮中走出的魔，有人說你是這亂世中最後一位真正的武者。\n\n天下無敵，卻也無人可與之把酒。你站在山巔，看見的是前所未有的寂寞。'},
 court_power:{n:'權傾朝野',t:'不知從何時起，朝中的詔令，都要先經過你的手。\n百官畏你、敬你、恨你、巴結你。皇帝、太后與諸侯，皆在你一念之間。你並非史上有名之人，卻成了這個時代最大的幕後之手。\n\n史書上沒有你的名字，因為真正的權力，從來不需要被記錄。'},
 save_han:{n:'匡扶漢室',t:'在你的奔走之下，漢室終於穩住了陣腳。獻帝重拾朝綱，諸侯俯首，四海重新聽見了「大漢」二字的回音。\n也許四百年的基業，真的能因你這個無名之人，再延續下去。\n\n你站在宮階上，看著少年天子，輕聲說：「陛下，臣在。」'},
 hermit:{n:'歸隱山林',t:'你拋卻一切紛爭，在山水之間搭了一間茅屋。\n曾經的名與利、愛與恨，都隨著遠去的馬蹄聲消散。偶有旅人經過，提及某某又勝了、某某又敗了，你只是笑笑，給他倒一碗茶。\n\n亂世之中，能得一處安寧，也是一種圓滿。'},
 together:{n:'攜手天涯',t:'你牽起{who}的手，在晨霧中離開了這座城。\n沒有人知道你們去了哪裡，也沒有人知道，在這段腥風血雨的歲月裡，有兩個人，曾為彼此放下過一切。\n\n你們在江南水鄉住下，屋前有柳，屋後有橋。這大概，就是你能想到最好的結局。'},
 warlord:{n:'自立一方',t:'你以亂世為棋盤，憑一手好牌，竟拉起了一支令諸侯側目的隊伍。\n你沒有出現在十八路諸侯的名單裡，但沒有人再敢忽視你。\n史書也許終究會為你留下一筆——「又有豪傑起於草莽」。'},
 executed:{n:'血濺刑場',t:'刑場之上，監斬官擲下令牌。\n你抬頭看了一眼灰暗的天空，想起自己曾經滿懷壯志踏入這亂世。刀光一閃，一切歸於寂靜。\n\n亂世之中，一個無名之人的死亡，連一滴水花也濺不起來——但也許，正是這樣的人，才最接近歷史的真相。'},
 die_prison:{n:'死於獄中',t:'潮濕的牢房裡，你再也沒能走出去。\n獄卒進來收屍時，只看見一個蜷縮在牆角的身影，嘴角似乎還帶著一絲倔強。'},
 die_hp:{n:'傷重不治',t:'你倒在了血泊裡，意識漸漸模糊。\n也許你的故事，在別人眼裡只是這場大亂中一段無關緊要的插曲……但至少，你曾真實地活過、爭過。'},
 final:{n:'建安二十五年',t:'建安二十五年，一代梟雄曹操病逝，漢室最後的燭火終於熄滅。\n你從一個無名之人，一步一步走到了今日。天下三分的格局已成，英雄與草莽皆化為風中塵埃。\n\n這一場亂世，究竟是你在影響歷史，還是歷史在塑造你？——也許，答案永遠在下一次選擇裡。'}

  return resultScene('尋找','你順著破舊的鑰匙孔，推開了西北角廢棄庫房的門。一位老宦官枯坐其中，面前一盞油燈，似乎已在此坐了數十年。\n他抬起渾濁的雙眼：「……你終於來了。」\n\n【新人物：無名老宦】現在可以在「拜訪人物」中找到他。'+fxLine(o2),'wuming','study');}

 var o4=applyFx(fx);return resultScene('尋找','你又在宮中翻找了七日，一無所獲。但你隱隱覺得，真相就在這座宮城的某個角落。'+fxLine(o4),'','study');

NODES.khMaster=function(){
 var P=S.p.st;
 if(!isEunuch()){
  return scene('老宦官細細打量你：「你是完整之人。老朽守著的東西，只授予『去根』之人。」\n他的聲音很輕，卻字字沉重：「欲練神功，必先自宮。」\n\n這條路無法回頭，你要如何選擇？','wuming',{bg:'study',kind:'event',
   ch:[ch('我願意，傳我神功','castrateKh'),ch('我再想想','hub')]});
 }
 var t1=S.flags.kh_t1,t2=S.flags.kh_t2,t3=S.flags.kh_t3;
 if(t1&&t2&&t3)return NODES.khGive();
 var c=[];
 if(!t1)c.push(ch('接受第一關：「靜」——靜坐三日，紋絲不動','khTrial',{k:1}));
 else if(!t2)c.push(ch('接受第二關：「忍」——受針刺之痛，不發一聲','khTrial',{k:2}));
 else c.push(ch('接受第三關：「悟」——解老人的啞謎','khTrial',{k:3}));
 c.push(ch('先告退','hub'));
 return scene('老宦官枯坐在燈影裡：「此物非天資者不可得，非心性者不可成。我有三關，你若全過，便予你。」\n\n進度：靜['+(t1?'✔':'　')+'] 忍['+(t2?'✔':'　')+'] 悟['+(t3?'✔':'　')+']','wuming',{bg:'study',kind:'event',ch:c});
};
NODES.castrateKh=function(){

};
NODES.khTrial=function(a){
 var k=a.k,P=S.p.st;var ok=false,t='',fx={days:3,st:{}};
 if(k===1){ok=rollD(35+P.stealth*0.6);t=ok?'三日三夜，你一動不動，蚊蟲爬上臉頰也不曾眨眼。老宦官點頭：「過了。」':'第二日夜裡，你的腿一抖，破了功。老宦官搖頭：「心不靜。」';fx.st.hp=-3;}
 else if(k===2){ok=rollD(30+P.hp*0.4+P.wu*0.2);t=ok?'一百零八根銀針，扎進你周身要穴。你咬著布巾，冷汗濕透了衣衫，卻始終不曾出聲。「過了。」':'你終於忍不住慘呼出聲。老宦官嘆了口氣：「回去養傷吧。」';fx.st.hp=-18;}

 if(ok)S.flags['kh_t'+k]=1;
 var o=applyFx(fx);

};
NODES.khGive=function(){
 S.flags.kh_done=1;S.npc.wuming.a=0;S.flags.wuming_gone=1;var fx={days:5,st:{wu:5,stealth:3,zhi:2,rep:0},kh:5};var o=applyFx(fx);

 return resultScene('寶典','三關俱過。老宦官從枯瘦的胸前取出一個油布包，遞給你。\n「世人皆說他是邪書，其實不過是一條……無路可退的路罷了。」\n他閉上雙眼，嘴角帶著一絲解脫的笑意。當你再次抬頭，他已經沒了氣息。\n\n【你得到了《葵花寶典》殘卷】現在可在「修練」中修習。每次修練都會有所精進，但亦有走火入魔之險。'+fxLine(o),'wuming','study');
};
NODES.kuihuaPractice=function(){
 var P=S.p.st;var fx={days:20,st:{},kh:0};var t;
 var risk=clamp(14-P.zhi*0.06-P.hp*0.05+S.p.kh*0.08,2,30);
 if(roll(risk)){fx.st.hp=-(18+rnd(12));fx.kh=-3;t='運功到緊要處，真氣在經脈中亂竄，你一口鮮血噴出，險些走火入魔。';}
 else{var g=5+Math.floor(P.zhi/25)+rnd(4);fx.kh=g;fx.st={stealth:roll(40)?1:0,hp:-3};t='你依法修煉，指尖的勁道愈發凝練。窗外的風與夜，彷彿都成了你的一部分。';}
 var o=applyFx(fx);
 // wu 隨 kh 提升
 var targetWu=Math.min(100,Math.max(S.p.st.wu,Math.round(S.p.st.wu+(S.p.kh%10<4?1:0))));
 var w0=S.p.st.wu;S.p.st.wu=clamp(Math.max(w0,35+Math.floor(S.p.kh*0.65)+Math.floor(w0>50?0:0)),0,S.flags.kh_done?100:95);
 if(S.p.kh>=100){S.p.st.wu=100;S.flags.kh_master=1;t+='\n\n你終於貫通全篇，周身氣勁圓融如一。這一刻，天下已無你不可殺之人。';}
 return resultScene('修習寶典',t+'\n寶典進度：'+S.p.kh+'/100　武力：'+S.p.st.wu+fxLine(o));
};

function directorMaybe(){
 if(!S||S.pending.length)return;
 if(S.day-S.lastDir<8)return;
 var f={history:0.7,balanced:1,free:1.4}[SET.free]||1;
 if(!roll(30*f))return;
 var sc=pickInterrupt();if(sc){S.pending.push(sc);S.lastDir=S.day;}
}
function pickInterrupt(){
 var pool=[];var vc=visitCandidates();for(var i=0;i<vc.length;i++)pool.push({k:'v',d:vc[i],w:vc[i].w*1.6});
 for(i=0;i<RE.length;i++){var e=RE[i];var ok=false;try{ok=e.c();}catch(er){ok=false;}if(ok)pool.push({k:'e',d:e,w:e.w});}
 for(i=0;i<QT.length;i++){var q=QT[i];var ok2=false;try{ok2=q.c();}catch(er2){ok2=false;}if(ok2)pool.push({k:'q',d:q,w:q.w});}
 if(SET.ai&&SET.aiMode==='full'&&AI.ready()&&S.turn%Math.max(1,SET.aiRate)===0)pool.push({k:'ai',d:null,w:25});
 if(!pool.length)return null;
 var tot=0;for(i=0;i<pool.length;i++)tot+=pool[i].w;var r=rand()*tot;var sel=pool[0];
 for(i=0;i<pool.length;i++){r-=pool[i].w;if(r<=0){sel=pool[i];break;}}
 if(sel.k==='v')return visitScene(sel.d.id,sel.d.r);
 if(sel.k==='e')return reScene(sel.d);
 if(sel.k==='q')return sel.d.s();
 if(sel.k==='ai')return aiGenScene();
 return null;
}

/* ===== AI: 萬用 API（任何 OpenAI 相容服務）＋ Grok App 手動模式 ===== */
var AI={busy:null};
AI.ready=function(){
 if(!SET.ai)return false;
 if(SET.aiSrc==='manual')return true;
 if(S&&S.ai&&S.ai.paused)return false;
 if(AI.isBlocked())return false;
 if(AI.cool&&Date.now()<AI.cool)return false;
 if(SET.key)return true;
 return AI.isLocal(SET.base)||SET.preset==='custom';
};
AI.isLocal=function(b){return /^https?:\/\/(localhost|127\.|0\.0\.0\.0|192\.168\.|10\.|\[::1\]|[^\/]*\.local)/i.test(String(b||'').replace(/^\s+/,''));};
/* 永久性錯誤（401/402/403/404）：記住「這組 Key+端點+模型」不可用，之後一律走離線，直到設定被修改或測試成功 */
AI.sig=function(){return String(SET.key||'')+'|'+AI.endpoint()+'|'+String(SET.model||'');};
AI.isBlocked=function(){var b=SET.aiBlock;if(!b)return false;var i=b.indexOf('\u0001');return i>0&&b.slice(0,i)===AI.sig();};
AI.blockMsg=function(){var b=SET.aiBlock||'';var i=b.indexOf('\u0001');return i>0?b.slice(i+1):'';};
AI.block=function(msg){SET.aiBlock=AI.sig()+'\u0001'+String(msg||'').slice(0,160);saveSettings();};
AI.unblock=function(){SET.aiBlock='';AI.cool=0;saveSettings();if(S&&S.ai){S.ai.paused=0;S.ai.fails=0;}};
AI.manual=function(){return !!SET.ai&&SET.aiSrc==='manual';};

/* ===== AUDIO: WebAudio 音效與五聲音階 BGM ===== */
var SND={ctx:null,master:null,bgmTimer:null,bgmOn:false,step:0,ok:false};
SND.res=function(){try{var pr=SND.ctx.resume();if(pr&&pr.catch)pr.catch(function(){});}catch(e){}};
SND.init=function(){
 if(SND.ctx){if(SND.ctx.state==='suspended'){SND.res();}return true;}
 try{var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;SND.ctx=new AC();SND.master=SND.ctx.createGain();SND.master.gain.value=0.5;SND.master.connect(SND.ctx.destination);SND.ok=true;
  if(SND.ctx.state==='suspended'){SND.res();}
  // iOS 解鎖：播放一個靜音緩衝
  try{var b=SND.ctx.createBuffer(1,1,22050);var s=SND.ctx.createBufferSource();s.buffer=b;s.connect(SND.ctx.destination);if(s.start)s.start(0);else s.noteOn(0);}catch(e2){}
  return true;}catch(e){SND.ok=false;return false;}
};
SND.vol=function(){if(SND.master)SND.master.gain.value=Math.max(0,Math.min(1,SET.vol));};
SND.tone=function(f,t0,dur,type,gain,slideTo){
 if(!SND.ctx)return;var c=SND.ctx;var o=c.createOscillator();var g=c.createGain();o.type=type||'triangle';o.frequency.setValueAtTime(f,t0);
 if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t0+dur);
 g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(gain||0.2,t0+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
 o.connect(g);g.connect(SND.master);o.start(t0);o.stop(t0+dur+0.05);
};
SND.noise=function(t0,dur,gain,hp){
 if(!SND.ctx)return;var c=SND.ctx;var n=Math.floor(c.sampleRate*dur);var b=c.createBuffer(1,n,c.sampleRate);var d=b.getChannelData(0);for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
 var s=c.createBufferSource();s.buffer=b;var g=c.createGain();g.gain.value=gain||0.2;var f=c.createBiquadFilter();f.type='highpass';f.frequency.value=hp||1500;s.connect(f);f.connect(g);g.connect(SND.master);s.start(t0);
};
SND.sfx=function(k){
 if(!SET.sfx||!SND.ctx||SND.ctx.state==='suspended')return;SND.vol();var t=SND.ctx.currentTime+0.01;
 try{
 if(k==='click'){SND.tone(660,t,0.07,'square',0.08);}
 else if(k==='ok'){SND.tone(523,t,0.12,'triangle',0.2);SND.tone(784,t+0.1,0.2,'triangle',0.2);}
 else if(k==='bad'){SND.tone(220,t,0.2,'sawtooth',0.12,110);SND.tone(165,t+0.15,0.3,'sawtooth',0.1,80);}
 else if(k==='coin'){SND.tone(988,t,0.08,'square',0.1);SND.tone(1319,t+0.08,0.2,'square',0.1);}
 else if(k==='sword'){SND.noise(t,0.18,0.3,2500);SND.tone(1800,t,0.15,'sawtooth',0.05,600);}
 else if(k==='alert'){SND.tone(440,t,0.12,'square',0.1);SND.tone(330,t+0.14,0.12,'square',0.1);SND.tone(440,t+0.28,0.16,'square',0.1);}
 else if(k==='page'){SND.noise(t,0.08,0.08,3500);}
 else if(k==='gong'){SND.tone(110,t,1.6,'sine',0.35);SND.tone(165,t,1.2,'sine',0.15);}
 else if(k==='type'){SND.tone(900,t,0.02,'square',0.015);}
 }catch(e){}
};
var BGM_SCALE=[0,2,4,7,9]; // 宮商角徵羽
SND.note=function(i){var oct=Math.floor(i/5),d=((i%5)+5)%5;var semis=BGM_SCALE[d]+12*oct;return 220*Math.pow(2,semis/12);};
SND.bgmStart=function(){
 if(SND.bgmTimer||!SND.ctx)return;SND.bgmOn=true;SND.vol();
 var pat=[0,2,4,3,2,1,0,-1],pos=0,mel=5;
 var tick=function(){
  if(!SND.bgmOn||!SET.bgm||!SND.ctx){SND.bgmStop();return;}
  if(SND.ctx.state==='suspended'){SND.bgmTimer=setTimeout(tick,1000);return;}
  var t=SND.ctx.currentTime+0.05;
  if(pos%8===0){SND.tone(SND.note(-5),t,3.2,'sine',0.10);SND.tone(SND.note(-5)*1.5,t,3.0,'sine',0.04);}
  var r=Math.random();
  if(r<0.72){var step=Math.floor(Math.random()*5)-2;mel=Math.max(0,Math.min(11,mel+step));
   SND.tone(SND.note(mel),t,0.9,'triangle',0.09);if(Math.random()<0.3)SND.tone(SND.note(mel+5),t+0.02,0.5,'sine',0.03);}
  pos++;
  SND.bgmTimer=setTimeout(tick,pos%4===0?800:480);
 };
 tick();
};
SND.bgmStop=function(){SND.bgmOn=false;if(SND.bgmTimer){clearTimeout(SND.bgmTimer);SND.bgmTimer=null;}};
SND.apply=function(){SND.vol();if(SET.bgm&&SND.ctx)SND.bgmStart();else SND.bgmStop();};

   UIs.xbad++;msg.className='fwarn';

  UIs.xcur=null;hideX();SND.sfx('ok');o.resolve(r);

var SQ={},SQL=[];
function O(l,s,b,ot,of,ft,ff){return {l:l,s:s,b:b,ot:ot,of:of||{},ft:ft||'',ff:ff||{}};}
function ST(t,o,gap){return {t:t,o:o,gap:gap||16};}
function Q(id,k,n,d,when,steps,fin,who){var q={id:id,k:k,n:n,d:d,when:when,steps:steps,fin:fin,who:who||null};SQ[id]=q;SQL.push(q);}
function sqState(id){return X().sq[id]||null;}
function sqStage(id){var s=sqState(id);return s?s.s:0;}
function sqActive(){var n=0;for(var i=0;i<SQL.length;i++){var s=sqState(SQL[i].id);if(s&&s.st==='active')n++;}return n;}
function sqDoneCount(k){var n=0;for(var i=0;i<SQL.length;i++){var s=sqState(SQL[i].id);if(s&&s.st==='done'&&(!k||SQL[i].k===k))n++;}return n;}
function sqReady(){var r=[];for(var i=0;i<SQL.length;i++){var s=sqState(SQL[i].id);if(s&&s.st==='active'&&s.due<=S.day)r.push(SQL[i]);}return r;}
function sqAvail(){var r=[];for(var i=0;i<SQL.length;i++){var q=SQL[i];if(sqState(q.id))continue;var ok=false;try{ok=q.when();}catch(e){ok=false;}if(ok)r.push(q);}return r;}
function sqTxt(q,t){var s=sqState(q.id);var W=s&&s.w?nm(s.w):'';return String(t).replace(/\{W\}/g,W).replace(/\{T\}/g,W).replace(/\{P\}/g,S.p.name);}
function sqFx(fx){
 if(!fx)return {};var o={};for(var k in fx)o[k]=fx[k];
 if(o.eq){if(EQ[o.eq])eqGive(o.eq);delete o.eq;}
 if(o.book){X().misc['own_'+o.book]=1;delete o.book;}
 if(o.sp){X().bonusSp=(X().bonusSp||0)+o.sp;delete o.sp;}
 if(o.ally){X().allies[o.ally]=1;delete o.ally;}
 return o;
}
NODES.board=function(){
 var av=sqAvail();var c=[];var lim=3-sqActive();
 var n=Math.min(4,av.length);var start=av.length?(S.day%av.length):0;var shown=[];
 for(var i=0;i<n;i++){var q=av[(start+i)%av.length];shown.push(q);}
 var t='告示板上貼滿了各式各樣的告示與懸賞。\n';
 if(!shown.length)t+='眼下沒有適合你的告示，過些時日再來看看吧。';
 if(lim<=0)t+='\n（你手頭已有三件事在辦，再多恐怕忙不過來。）';
 for(i=0;i<shown.length;i++){var qq=shown[i];t+='\n・【'+({love:'情',revenge:'仇',court:'宮',jianghu:'江湖',faction:'勢力',person:'人物'}[qq.k]||'事')+'】'+qq.n+'：'+qq.d;
  if(lim>0)c.push(ch('接下：'+qq.n,'sqStart',{id:qq.id}));}
 c.push(plain('↩ 返回','hub'));
 return scene(t,'',{kind:'menu',bg:S.p.spot,ch:c});
};
NODES.sqStart=function(a){
 var q=SQ[a.id];if(!q||sqState(q.id))return NODES.board();
 var w=q.who?q.who():'';
 X().sq[q.id]={s:0,due:S.day+3,st:'active',w:w||''};
 addQuest({id:'sq_'+q.id,t:q.n,d:sqTxt(q,q.d)});
 timePass(1);
 return PL('接下任務','你記下了這件事：「'+q.n+'」。\n'+sqTxt(q,q.d)+'\n\n過些時日，事情自會有進展。（屆時主選單會出現「支線」選項。）',null);
};
NODES.sqStep=function(a){
 var q=SQ[a.id];var s=sqState(q.id);if(!s||s.st!=='active')return NODES.hub();
 var stp=q.steps[s.s];var c=[];
 for(var i=0;i<stp.o.length;i++){var o=stp.o[i];c.push(ch(sqTxt(q,o.l),'sqRes',{id:q.id,i:i}));}
 return scene('【'+q.n+'·第'+(s.s+1)+'章】\n'+sqTxt(q,stp.t),s.w||'',{kind:'event',bg:S.p.spot,ch:c});
};
NODES.sqRes=function(a){
 var q=SQ[a.id];var s=sqState(q.id);var stp=q.steps[s.s];var o=stp.o[a.i];
 var pass=true;if(o.s){var v=pStat(o.s);pass=rollD(o.b+v*0.5);}else if(o.b){pass=rollD(o.b);}
 var txt=pass?o.ot:o.ft;var fx=sqFx(pass?o.of:o.ff);var failQ=!!(fx.fail);delete fx.fail;
 var out=applyFx(fx);txt=sqTxt(q,txt);
 s.s++;s.due=S.day+(stp.gap||16);
 var fin='';
 if(failQ){s.st='fail';questState('sq_'+q.id,'fail');fin='\n\n〔這件事就此不了了之。〕';}
 else if(s.s>=q.steps.length){
  s.st='done';var ff=sqFx(q.fin.fx);var o2=applyFx(ff);questState('sq_'+q.id,'done');cnt('sqdone');
  fin='\n\n★ 任務完成：「'+q.n+'」\n'+sqTxt(q,q.fin.t)+fxLine(o2);
  if(q.fin.flag)S.flags[q.fin.flag]=1;
  if(q.fin.love&&s.w){S.flags['lover_'+s.w]=1;}
  if(q.fin.wed)S.flags.wed=s.w||1;
  if(q.fin.flagAvenge)S.flags.avenged=1;
  if(q.fin.puppet)S.flags.puppet=1;
  addLog('完成支線「'+q.n+'」。');
 }
 if(S.p.st.hp<=0)return endingScene('die_hp');
 return resultScene(q.n,txt+fxLine(out)+fin,s.w&&NPC[s.w]?s.w:'',S.p.spot);
};

NODES.bag=function(){
 var x=X();var t='【行囊·裝備】\n';
 t+='兵器：'+eqName(x.eq.w)+'　衣甲：'+eqName(x.eq.r)+'　飾物：'+eqName(x.eq.a)+'\n';
 t+='裝備加成：';var bs=[];var ks=['wu','zhi','zheng','mei','tong','stealth'];for(var i=0;i<ks.length;i++){var v=eqBonus(ks[i]);if(v)bs.push(ST_NAMES[ks[i]]+'+'+v);}
 t+=(bs.length?bs.join(' '):'無')+(dmgMul()<1?'　受傷×'+dmgMul().toFixed(2):'')+'\n';
 var its=invList();t+='物品：'+(its.length?its.map(function(k){return ITEMS[k].n+'×'+itemCount(k);}).join('、'):'（空）')+'\n';
 var bk=[];for(var b in x.misc){if(b.indexOf('own_')===0&&!x.read[b.slice(4)]&&BOOKS[b.slice(4)])bk.push(BOOKS[b.slice(4)].n);}
 if(bk.length)t+='未讀之書：'+bk.join('、')+'\n';
 var c=[];
 var us=['medicine','bigmed','antidote','elixir'];
 for(i=0;i<us.length;i++){if(itemCount(us[i])>0)c.push(ch('使用'+ITEMS[us[i]].n+'（×'+itemCount(us[i])+'）：'+ITEMS[us[i]].d,'bagUse',{k:us[i]}));}
 for(var e in x.own){if(!EQ[e])continue;var sl=EQ[e].slot;if(x.eq[sl]===e)c.push(ch('卸下'+EQ[e].n,'equip',{k:e,off:1}));else c.push(ch('裝備'+EQ[e].n+'（'+EQ[e].d+'）','equip',{k:e}));}
 c.push(plain('↩ 返回','hub'));
 return scene(t,'',{kind:'menu',bg:S.p.spot,ch:c});
};
NODES.equip=function(a){

};

 else{fx.st.hp=30;var ks=['wu','zhi','zheng','mei','tong','stealth'];fx.st[pick(ks)]=1;fx.st[pick(ks)]=(fx.st[ks[0]]||0);t='丹藥入腹，真氣周流，通體舒暢。';}

};

function achCheck(){
 var x=X();var res=[];
 if(S.p.st.hp<=10&&S.p.st.hp>0)x.misc.edge=1;
 x.misc.seas=x.misc.seas||{};x.misc.seas[seasonOf()]=1;

/* ===== DIALOG: 對話樹引擎（人物專屬互動／地點對話／每日遭遇／抉擇回顧） ===== */
var DTS={},DT_NPC={},DT_SPOT={},DT_ENC=[],DT_ORDER=[];
var STAT_TAG={wu:'武',zhi:'智',zheng:'政',mei:'魅',tong:'統',rep:'望',stealth:'隱',luck:'運'};
/* DT(id,{npc|spot|enc,ti,c,after,rep,w,n:{key:{t,sp,fx,o:[[文字,下一節,結果描述,fx,{chk:[屬性,難度],ng,nr,nfx,gold,if,cons}]]}}}) */
function dtIf(f){if(!f)return null;if(typeof f==='function')return f;return function(){return !!(S.flags[f]||(S.p.items&&S.p.items[f]>0));};}
function DT(id,o){
 o.id=id;DTS[id]=o;DT_ORDER.push(id);
 if(o.npc){(DT_NPC[o.npc]=DT_NPC[o.npc]||[]).push(id);}
 if(o.spot){(DT_SPOT[o.spot]=DT_SPOT[o.spot]||[]).push(id);}
 if(o.enc){DT_ENC.push(id);}
 for(var k in o.n){var nd=o.n[k];var ol=[];
  for(var i=0;nd.o&&i<nd.o.length;i++){var a=nd.o[i];
   if(a instanceof Array){var x=a[4]||{};ol.push({t:a[0],to:a[1]||'',r:a[2]||'',fx:a[3]||null,chk:x.chk||null,ng:x.ng||'',nr:x.nr||'',nfx:x.nfx||null,gold:x.gold||0,iff:dtIf(x['if']),cons:x.cons||''});}
   else ol.push(a);}
  nd.o=ol;}
 return o;
}
function dtDay(id){return S.flags['dt_'+id]||0;}
function dtDone(id){return !!S.flags['dt_'+id];}
function dtAvail(id){
 var tp=DTS[id];if(!tp)return false;
 var d=dtDay(id);
 if(d){if(!tp.rep||S.day-d<tp.rep)return false;}
 if(tp.after){var af=(tp.after instanceof Array)?tp.after:[tp.after];for(var i=0;i<af.length;i++){if(!dtDone(af[i]))return false;}}
 if(tp.npc&&!alive(tp.npc))return false;
 if(tp.c){try{if(!tp.c())return false;}catch(e){return false;}}
 return true;
}
function dtList(key,val){
 var arr=(key==='npc'?DT_NPC:DT_SPOT)[val]||[];var out=[];
 for(var i=0;i<arr.length;i++){if(dtAvail(arr[i]))out.push(arr[i]);}
 return out;
}
function dtTxt(s,tp){
 if(typeof s==='function'){try{s=s();}catch(e){s='';}}
 s=String(s||'');
 var N=tp&&tp.npc?nm(tp.npc):'';
 return s.replace(/\{P\}/g,S.p.name).replace(/\{N\}/g,N).replace(/\{T\}/g,honor()).replace(/\{R\}/g,regionName(S.p.region).split('·')[0])
  .replace(/\{B\}/g,(bossOf()?nm(bossOf()):'主公')).replace(/\{G\}/g,S.p.gender==='f'?'姑娘':'公子').replace(/\{M\}/g,S.p.gender==='f'?'她':'他');
}
function dtOptLabel(o,tp){
 var t=dtTxt(o.t,tp);
 if(o.chk)t+='〔'+(STAT_TAG[o.chk[0]]||o.chk[0])+' '+o.chk[1]+'〕';
 if(o.gold)t+='（'+(o.gold>0?'-':'+')+Math.abs(o.gold)+'金）';
 return t;
}
function dtMark(tp){
 if(!S.flags['dt_'+tp.id]){S.x.dtN=(S.x.dtN||0)+1;}
 S.flags['dt_'+tp.id]=S.day||1;
 addLog('【'+tp.ti+'】話題告一段落。');
}
function dtCons(tp,o,sum){
 var x=X();if(!x.cons)x.cons=[];
 x.cons.push({d:S.day,t:tp.ti,p:dtTxt(o.t,tp).slice(0,40),r:sum});
 if(x.cons.length>160)x.cons.shift();
}
NODES.dtList=function(a){
 var ids=dtList(a.npc?'npc':'spot',a.npc||a.spot);
 var tit=a.npc?('與'+nm(a.npc)+'深談'):(DT_SPOT_TITLE[a.spot]||'交談');
 var c=[];
 for(var i=0;i<ids.length&&i<9;i++){var tp=DTS[ids[i]];c.push(ch('◆ '+tp.ti,'dt',{id:ids[i],k:'start'},null,{pk:1}));}
 c.push(ch('↩ 返回',a.npc?'talkMenu':'hub',a.npc?{id:a.npc,pass:1}:null));
 var t='【'+tit+'】\n'+(ids.length?'可以聊的話題（'+ids.length+'）：':'目前沒有新的話題，過些日子再來，或做出不同的選擇，也許會有新的發展。');
 return scene(t,a.npc||'',{bg:S.p.spot,kind:'menu',ch:c});
};
NODES.dt=function(a){
 var tp=DTS[a.id];if(!tp)return NODES.hub();
 var nd=tp.n[a.k||'start'];if(!nd)return NODES.hub();
 var out=[];if(nd.fx){out=applyFx(nd.fx);}
 var txt=dtTxt(nd.t,tp);
 var pre=a.pre?a.pre+'\n\n':'';
 var c=[];
 for(var i=0;i<nd.o.length;i++){var o=nd.o[i];
  if(o.iff){var ok=false;try{ok=o.iff();}catch(e){ok=false;}if(!ok)continue;}
  if(o.gold>0&&S.p.st.gold<o.gold)continue;
  c.push(ch(dtOptLabel(o,tp),'dtPick',{id:a.id,k:a.k||'start',i:i}));}
 var head='【'+tp.ti+'】\n';
 if(!c.length){
  dtMark(tp);
  return scene(head+pre+txt+fxLine(out)+'\n\n（話題結束）',nd.sp||tp.npc||'',{bg:nd.bg||tp.bg||S.p.spot,kind:'result',ch:[ch('繼續','hub')]});
 }
 return scene(head+pre+txt+fxLine(out),nd.sp||tp.npc||'',{bg:nd.bg||tp.bg||S.p.spot,kind:'talk',ch:c});

NODES.dtPick=function(a){

 }

 else{res=dtTxt(o.nr||'你沒能做到，局面變得有些尷尬。',tp);fx=o.nfx;to=o.ng||o.to;}
 var out=fx?applyFx(fx):[];

 dtCons(tp,o,cons||'（無明顯變化）');

/* 每日隨機遭遇：每天最多一次，街上、水邊、野外都可能碰上 */
function encPick(){
 var pool=[];var tot=0;
 for(var i=0;i<DT_ENC.length;i++){var id=DT_ENC[i];var tp=DTS[id];
  if(tp.rep===undefined){tp.rep=40;}
  if(!dtAvail(id))continue;
  if(tp.at&&tp.at.indexOf(S.p.spot)<0)continue;
  if(tp.night===1&&!isNight())continue;
  if(tp.night===-1&&isNight())continue;
  if(tp.season&&tp.season!==seasonOf())continue;
  var w=tp.w||5;pool.push([id,w]);tot+=w;}
 if(!pool.length)return null;
 var r=rand()*tot;for(i=0;i<pool.length;i++){r-=pool[i][1];if(r<=0)return pool[i][0];}
 return pool[0][0];
}

  if(S.scene&&S.scene.kind==='ending')return;
  var rate={history:0.16,balanced:0.24,free:0.34}[SET.free]||0.24;
  if(rand()>rate)return;
  var id=encPick();if(!id)return;
  x.encN=(x.encN||0)+1;

 }catch(e){if(window.console)console.error('enc',e);}
};

  ['幫他吆喝，招呼客人','help','',null,{chk:['mei',30],ng:'buy',nr:'你的吆喝沒起什麼作用，劉備卻笑著謝了你。'}]]},
 buy:{t:'他接過銅錢，認真地把鞋遞給你：「穿壞了來找我，我給你補。」',o:[['道謝離開','end','這雙草鞋手工紮實。劉備的誠懇讓你印象很深。',rf('liubei',{af:4,tr:2})]]},
 kin:{t:'劉備一怔，隨即苦笑：「中山靖王之後，不過一個名頭。祖上的榮光早成了舊賬。」他望向天邊，「可我還記得，漢室於我，不只是姓氏。」',o:[
  ['「人在草鞋攤，志在四海。」','end','劉備握住你的手：「得此一言，勝過千金。」',rf('liubei',{tr:8,af:7,re:6},{rep:1})],
  ['「宗室又如何？亂世看的是本事。」','end','劉備點頭：「你說得對。所以我才一日不敢懈怠。」',rf('liubei',{tr:3,re:4})]]},
 help:{t:'你站起來扯開嗓子，招來了一群婦人。草鞋一眨眼賣了大半。劉備又驚又喜，拉著你坐下，倒了一碗粗茶。',o:[['飲茶閒聊','kin2','',null]]},
 kin2:{t:'劉備說起少時與母親織蓆販履的日子，說起門前那棵桑樹，說「將來我要乘羽葆蓋車」。他不是在炫耀，而是在祈願。',o:[['認真傾聽','end','你與劉備由此成了朋友。',rf('liubei',{af:9,tr:7,re:5})]]},
 end:{t:'日頭偏西，草鞋攤前人漸散去。',o:[]}}});
DT('lb_oath',{npc:'liubei',ti:'桃園之約',after:'lb_straw',c:function(){return R('liubei').af>=20&&yrGE(184);},bg:'garden',n:{
 start:{t:'劉備邀你至桃園。他身旁有兩位壯漢——一個面如重棗、長髯過腹，一個豹頭環眼、燕頷虎鬚。「這是雲長，這是翼德。」',o:[
  ['向關羽、張飛見禮','meet','',null],
  ['半開玩笑：「三位這是要結拜？」','joke','',null]]},
 meet:{t:'關羽微微頷首，目光如刀；張飛則大笑：「這位朋友看著順眼！」劉備說：「我們三人欲結為異姓兄弟，同心協力，匡扶漢室。{P}若不嫌棄，可為見證。」',o:[
  ['誠懇祝福，願為見證','wit','',null],
  ['婉言：「我人微言輕，不敢逾越。」','dec','',null]]},
 joke:{t:'張飛哈哈大笑，關羽也忍不住嘴角上揚。劉備點頭承認：「正是。你既撞見，便是緣分。」',o:[['順勢留下作見證','wit','',null]]},
 wit:{t:'三人跪於桃樹下，焚香盟誓：「不求同年同月同日生，但求同年同月同日死。」風起，花落如雨。你站在一旁，竟覺眼眶微熱。',o:[
  ['敬酒一杯','end','你親眼見證這場結拜。三人對你多了一份信任。',rf('liubei',{tr:10,af:8,ly:3},{rep:2},{rel:{liubei:{tr:10,af:8,ly:3},guanyu:{tr:6,af:5},zhangfei:{tr:7,af:7}},flags:{lb_oath:1}})]]},
 dec:{t:'劉備笑道：「也好。你記得今日就是。」',o:[['行禮','end','你雖未入局，卻記下了這一幕。',rf('liubei',{af:3,re:3})]]},
 end:{t:'桃花瓣落了一地。亂世之中，這或許是最乾淨的一個誓言。',o:[]}}});
DT('lb_refugee',{npc:'liubei',ti:'百姓隨行',c:function(){return R('liubei').tr>=30;},bg:'wild',n:{
 start:{t:'曹兵追近，劉備卻不肯棄民而走。身後是數萬扶老攜幼的百姓。他向你求助：「{P}，行軍緩慢，若為我一人棄之，我何顏面？」',o:[
  ['勸他先行：「民不可為所累，主公安危為重。」','leave','',null],
  ['出主意：派老弱先走，青壯斷後','split','',null,{chk:['tong',35],ng:'split_f',nr:'你的安排有疏漏，隊伍亂了陣腳。'}],
  ['自願斷後','guard','',null,{chk:['wu',50],ng:'guard_f',nr:'你抵擋不住追兵，狼狽退下。'}]]},
 leave:{t:'劉備搖頭，眼眶泛紅：「大事必以人為本。今人歸吾，奈何棄之？」他不聽勸，毅然與百姓同行。',o:[['無言追隨','end','你看著這個傻得近乎固執的人，卻說不出話來。',rf('liubei',{re:8,af:4,tr:2})]]},
 split:{t:'你把隊伍分成數段：老弱在前，青壯在後，沿途設疑兵。劉備感激地握住你的手：「若非你，百姓傷亡不知多少。」',o:[['謙遜','end','此役你救下不少人，劉備對你敬重有加。',rf('liubei',{tr:10,af:8,re:9},{tong:1,rep:3,merit:4})]]},
 split_f:{t:'隊伍一陣混亂，傷亡不小。劉備沒有責怪你，只是疲憊地坐在路邊。',o:[['歉疚地低頭','end','你有些內疚，這次教訓很深。',rf('liubei',{af:3},{tong:1,hp:-5})]]},
 guard:{t:'你橫刀立馬立於橋頭，追兵為之一滯。待百姓遠去，你負傷而退。',o:[['喘息著歸隊','end','劉備親自替你包紮傷口，淚水沾濕了你的衣袖。',rf('liubei',{tr:12,af:10,re:10,ly:4},{wu:1,rep:4,hp:-10})]]},
 guard_f:{t:'你抵不住追兵，被打得連連後退，幸得關羽、張飛趕來救下。',o:[['愧然致謝','end','你受了傷，但劉備待你一如既往。',rf('liubei',{af:5},{hp:-14,wu:1})]]},
 end:{t:'塵煙漸遠，一條長長的流民隊伍，在黃昏中蜿蜒。',o:[]}}});
DT('lb_zhuge',{npc:'liubei',ti:'三顧之問',c:function(){return alv('zhugeliang')&&R('liubei').tr>=35&&yrGE(190);},bg:'water',n:{
 start:{t:'劉備說他要去拜訪一位隱居山中的年輕人，已去了兩回，皆不遇。「{P}，你隨我去第三回，可好？」',o:[
  ['欣然同往','go','',null],
  ['勸他：「主公親自三顧，恐折身份。」','warn','',null],
  ['婉拒，改日再說','no','',null]]},
 go:{t:'草廬前，童子輕聲說：「先生午睡未醒。」劉備垂手肅立，良久不動。門內終於傳來一句：「大夢誰先覺？平生我自知。」',o:[
  ['看劉備的反應','see','',null]]},
 see:{t:'劉備整衣而入，二人長談，直到燭盡。你在一旁聽得入神，那個臥龍所言，竟為你打開了一扇新窗。',o:[
  ['悄悄記下對話中的要點','end','你從這場談話中悟出不少天下形勢，對劉備的敬意更深。',{rel:{liubei:{tr:7,af:6,re:6},zhugeliang:{af:4,re:5}},st:{zhi:2,rep:1},flags:{lb_zhuge:1}}]]},
 warn:{t:'劉備看了你一眼，溫聲道：「身份是給人看的。賢才，是給天下的。」',o:[['面紅耳赤','end','你被這句話說得無地自容，卻也因此更敬重他。',rf('liubei',{re:6,af:3})]]},
 no:{t:'劉備點頭：「也好，我自己去。」',o:[['目送他遠去','end','你錯過了一個歷史性的時刻。',null]]},
 end:{t:'暮色蒼茫，山中鐘聲遙遙傳來。',o:[]}}});

/* ---------- 孫堅 ---------- */
DT('sj_boat',{npc:'sunjian',ti:'江上巡江',bg:'water',n:{
 start:{t:'孫堅立在戰船船頭，江風獵獵。他回頭問你：「{P}，我年少時帶一艘小船就敢追海盜，如今手下有千人。你猜我最愛哪個時候？」',o:[
  ['「追海盜的那時。」','a','',null],
  ['「如今，一呼百應。」','b','',null],
  ['「還沒到——最愛的時候在後頭。」','c','',null,{chk:['zhi',35],ng:'a',nr:'你猶豫了一下，改口說了前一個答案。'}]]},
 a:{t:'孫堅仰頭大笑：「對！那時才叫痛快，一刀一槍拼出來的名聲！」',o:[['陪他乾了一碗','end','你與孫堅的距離拉近了一些。',rf('sunjian',{af:6,tr:3})]]},
 b:{t:'孫堅笑意淡了些：「一呼百應，也得一刀一槍頂著。別以為人多就是福氣。」',o:[['點頭','end','你收斂了笑意。孫堅對你的看法略有保留。',rf('sunjian',{re:3})]]},
 c:{t:'孫堅一愣，眼睛亮了：「好！好一個『在後頭』！老子等的就是這個！」他一把攬住你的肩。',o:[['笑而不語','end','孫堅把你當成了知己。',rf('sunjian',{af:9,tr:7,re:5},{rep:1})]]},
 end:{t:'江水滔滔，戰船劈波斬浪而去。',o:[]}}});
DT('sj_seal',{npc:'sunjian',ti:'井中玉璽',c:function(){return yrGE(190)&&R('sunjian').tr>=30;},bg:'palace',n:{
 start:{t:'洛陽廢墟，孫堅的士兵從一口古井中撈出一具宮女屍首，頸上繫著一只錦匣。匣中靜靜躺著一枚玉璽——傳國玉璽。孫堅屏退左右，只留下你。「{P}，此物，要不要獻給朝廷？」',o:[
  ['勸他獻出：「此物關乎天下，非私人可有。」','give','',null],
  ['低聲勸：「先留下，待天下有主再說。」','keep','',null],
  ['堅決：「此物會招禍，速速處理。」','burn','',null,{chk:['zhi',45],ng:'keep',nr:'孫堅對你的反對聽而不聞。'}]]},
 give:{t:'孫堅沉默，手指摩挲玉璽，終於搖頭：「你說得對，卻太遲了。」他的眼神複雜，「我已經動了心。」',o:[['歎息','end','你的話讓孫堅有所動搖，但他終究未能抗拒誘惑。',rf('sunjian',{re:5,tr:3},{rep:1},fl('sj_seal_talk'))]]},
 keep:{t:'孫堅看著你，低聲說：「我們想到一處去了。」他收起玉璽，嘴角帶笑。',o:[['心裡忐忑','end','你成了孫堅的同謀。玉璽的秘密，將是你們之間的紐帶，也是隱患。',rf('sunjian',{tr:9,ly:5,af:6},null,fl('sj_seal_talk'))]]},
 burn:{t:'孫堅盯著你，眼神鋒利：「我孫文臺的事，不勞他人置喙。」',o:[['低頭','end','你冒犯了他。孫堅沒有發作，但記下了。',rf('sunjian',{su:6,af:-3,tr:-2})]]},
 end:{t:'井口黑黝黝，彷彿吞下了無數不能說的話。',o:[]}}});
DT('sj_ride',{npc:'sunjian',ti:'陣前單騎',c:function(){return R('sunjian').tr>=20&&S.p.st.wu>=40;},bg:'battle',n:{
 start:{t:'汜水關外，孫堅披甲上馬，朝你喊道：「{P}，隨我衝一陣！」',o:[
  ['策馬緊隨','charge','',null,{chk:['wu',50],ng:'fall',nr:'你的馬受了驚，差點被甩下。'}],
  ['請命守寨','stay','',null],
  ['苦勸：「敵情不明，不可輕進！」','warn','',null,{chk:['zhi',42],ng:'charge',nr:'孫堅不聽勸，你只好咬牙跟上。'}]]},
 charge:{t:'你與孫堅並轡衝入敵陣，長刀所向，披靡一片。孫堅大笑：「痛快！」',o:[['血戰到底','end','此役你與孫堅並肩死戰，結下過命的交情。',rf('sunjian',{tr:10,af:10,re:8},{wu:2,rep:3,merit:5,hp:-10})]]},
 fall:{t:'你好不容易穩住馬，已落在隊尾。戰後孫堅調侃：「馬都管不好，還想建功？」',o:[['訕笑','end','雖丟了臉，但沒有致命的損失。',rf('sunjian',{af:2},{hp:-6})]]},
 stay:{t:'孫堅哼了一聲：「膽小。」但還是點頭，把後方交給了你。',o:[['守好寨門','end','你守住了營寨，孫堅得勝而歸。',rf('sunjian',{tr:4,re:2},{merit:2})]]},
 warn:{t:'孫堅勒住馬，咬牙看了你一眼，終於勒轉馬頭：「依你！」',o:[['鬆了口氣','end','你的謹慎避免了一場埋伏。孫堅事後感嘆：「你救了我。」',rf('sunjian',{tr:12,re:10,af:7},{zhi:1,rep:3,merit:4})]]},
 end:{t:'塵土落定，戰場上只剩下風聲。',o:[]}}});
DT('sj_family',{npc:'sunjian',ti:'兒郎們',after:'sj_boat',bg:'water',n:{
 start:{t:'孫堅帶你去看他的兒子們。長子孫策，眉宇間英氣逼人；次子孫權，少年老成，眼神沉靜。孫堅說：「這兩個小子，將來比我強。」',o:[
  ['誇孫策勇猛','a','',null],
  ['誇孫權沉穩','b','',null],
  ['兩人都誇','c','',null,{chk:['mei',30],ng:'a',nr:'你的誇獎有些生硬。'}]]},
 a:{t:'孫堅大樂：「這小子像我！」孫策甩了甩手臂，笑得燦爛。',o:[['也笑','end','你與孫策結下一份少年的情誼。',{rel:{sunjian:{af:5},sunce:{af:6,tr:3}}}]]},
 b:{t:'孫堅沉吟：「權兒……確實不像我。」他看向遠處靜坐的少年，神情複雜。',o:[['不多說','end','孫權記住了你。',{rel:{sunjian:{af:3},sunquan:{af:6,tr:4,re:3}}}]]},
 c:{t:'孫堅哈哈大笑，一手攬一個：「聽見沒？人家兩個都誇！」',o:[['會心一笑','end','氣氛融洽，孫家父子都對你印象不錯。',{rel:{sunjian:{af:7,tr:3},sunce:{af:4},sunquan:{af:4}},st:{mei:1}}]]},
 end:{t:'江風吹動旌旗，一家人的影子被夕陽拉得很長。',o:[]}}});
DT('sj_oath',{npc:'sunjian',ti:'誓報江東',c:function(){return R('sunjian').tr>=45&&S.p.fac==='sun';},after:'sj_ride',bg:'gate',n:{
 start:{t:'孫堅集結部眾，登壇誓師：「江東子弟，隨我橫掃四方！」他看向你：「{P}，你代我宣讀軍令！」',o:[
  ['朗聲宣讀','read','',null,{chk:['mei',40],ng:'read_f',nr:'你緊張得結巴了。'}],
  ['請程普代讀','pass','',null]]},
 read:{t:'你聲震全場，士氣高昂。孫堅按劍而笑，滿意地點頭。',o:[['歸列','end','三軍讚嘆。你在孫家軍中的威信大增。',rf('sunjian',{tr:8,re:7,af:5},{mei:1,rep:3,merit:4})]]},
 read_f:{t:'你吃了個螺絲，幾個老兵忍不住笑出聲。孫堅輕咳：「繼續。」',o:[['硬著頭皮念完','end','雖然出了醜，但孫堅沒有責備。',rf('sunjian',{af:2},{mei:1})]]},
 pass:{t:'孫堅微微皺眉，示意程普代勞。',o:[['退後','end','你錯失了一次展現的機會。',null]]},
 end:{t:'誓師完畢，大軍浩浩蕩蕩開拔。',o:[]}}});

/* ---------- 袁紹 ---------- */
DT('ys_feast',{npc:'yuanshao',ti:'四世三公的盛宴',bg:'palace',n:{
 start:{t:'袁紹府中大宴賓客，山珍海味、名士滿座。他舉杯向你：「{P}，聽說你有些見識，不妨與諸君說說。」',o:[
  ['謙辭不言','shy','',null],
  ['談天下大勢','talk','',null,{chk:['zhi',40],ng:'bad',nr:'你說得太淺，被一位名士當面反駁。'}],
  ['大敬主人，說盡吉祥話','flat','',null,{chk:['mei',35],ng:'bad',nr:'奉承得太刻意，連袁紹都皺了皺眉。'}]]},
 shy:{t:'袁紹點頭：「少年人，沉穩是好事。」座中有人輕蔑地笑了笑。',o:[['低頭飲酒','end','你平平無奇地度過了這場宴會。',rf('yuanshao',{af:1})]]},
 talk:{t:'你的見解引來陣陣讚歎。袁紹撫髯：「後生可畏。」謀士許攸卻眯起眼打量你，似乎在掂量你的分量。',o:[
  ['乘勢向許攸敬酒','end','你與袁紹、許攸都建立了聯繫。',{rel:{yuanshao:{tr:6,af:5,re:6},xuyou:{af:5,re:4}},st:{rep:2,zhi:1}}]]},
 flat:{t:'袁紹笑得眉開眼笑，頻頻舉杯：「說得好、說得好！」',o:[['乾杯','end','袁紹記住了這個「會說話」的年輕人。',rf('yuanshao',{af:7,tr:3},{rep:1,gold:-20})]]},
 bad:{t:'席間響起一陣低低的竊笑，袁紹和稀泥似的圓場，這場宴會你沒佔到什麼便宜。',o:[['訕訕退席','end','你的面子掛不住，但學到了教訓。',rf('yuanshao',{re:-1},{rep:-1,zhi:1})]]},
 end:{t:'宴散人去，燭花落了一地。',o:[]}}});
DT('ys_advice',{npc:'yuanshao',ti:'迎天子之議',after:'ys_feast',c:function(){return yrGE(190)&&R('yuanshao').tr>=25;},bg:'study',n:{
 start:{t:'許攸與沮授爭執不下：一說應迎天子於洛陽，以令諸侯；一說應按兵觀變。袁紹轉向你：「{P}，你怎麼看？」',o:[
  ['力主迎天子','pro','',null,{chk:['zhi',48],ng:'pro_f',nr:'袁紹冷哼：「迎來了，誰養？誰供？」你被問住。'}],
  ['附議按兵不動','wait','',null],
  ['兩可，建議派人探路','probe','',null]]},
 pro:{t:'你條分縷析，說得幾位謀士頻頻點頭。袁紹卻猶豫了：「若迎來一尊菩薩，我供得起麼？」',o:[
  ['「只要使天子在手，何患無兵？」','end','袁紹終究沒採納，但記下了你的話。這個機會，後來被曹操搶了。',rf('yuanshao',{tr:5,re:6},{zhi:1,rep:2})]]},
 pro_f:{t:'你的論點被批駁，座中有人輕笑。',o:[['低頭','end','你吃了一個啞巴虧。',rf('yuanshao',{re:-2},{zhi:1})]]},
 wait:{t:'袁紹滿意點頭：「穩重。」他喜歡聽這種話。',o:[['謙拜','end','你順了他的意，卻也失去了展現遠見的機會。',rf('yuanshao',{af:4,tr:3})]]},
 probe:{t:'袁紹拍案：「好！派人去探，不費一兵一卒。」他當即命你挑選人手。',o:[['領命','end','你得到一份差事，也得到袁紹的小小倚重。',rf('yuanshao',{tr:6,re:4},{merit:3})]]},

DT('xy_tea',{npc:'xunyu',ti:'文若論茶',bg:'study',n:{
 start:{t:'荀彧的書房清雅得近乎冷清，只有一壺茶、一卷竹簡。他抬眼：「{P}，坐。我不善寒暄，只問：你讀過什麼書？」',o:[

  ['「術為先。無術，義不能存。」','end','荀彧沉思片刻：「亦有道理，但失之於急。」',rf('xunyu',{tr:3,re:5},{zhi:1})]]},
 b:{t:'荀彧淡淡道：「雜學之人，往往機敏，亦往往浮躁。」',o:[['微笑應對','end','荀彧並不厭惡你，只是保持著距離。',rf('xunyu',{af:2,re:3})]]},

DT('xy_loyal',{npc:'xunyu',ti:'漢臣的堅持',after:'xy_plan',c:function(){return yrGE(192);},bg:'garden',n:{

  ['「扶得起，只要有人肯扶。」','a','',null],

DT('xy_poison',{npc:'xunyu',ti:'一簞食',c:function(){return yrGE(195)&&R('xunyu').tr>=45;},after:'xy_loyal',bg:'study',n:{

function loveP(id,k,a){

 var base={poem:44,company:60,gift:55,date:52,rescue:70,night:30,confess:20,oath:55,letter:48,probe:62}[k]||50;
 var p=base+r.h*0.28+appeal(id)*0.22-r.g*0.30;
 if(k==='poem'||k==='probe')p+=(S.p.st.zhi-40)*0.25;
 if(k==='company'||k==='date')p+=(S.p.st.mei-40)*0.12;
 if(k==='rescue')p+=(S.p.st.wu+S.p.st.zhi-70)*0.12;
 if(P.pf.indexOf('wt')>=0&&k==='poem')p+=8;
 if(a&&a.v){var V=DATE_V[a.v];var tod=todNow();if(V.tod===tod||(V.tod==='dusk'&&tod==='night')||(V.tod==='night'&&tod==='dusk'))p+=8;else if(V.tod==='night'&&tod==='day')p-=10;

function resOf(p,k){

 if(d<p+(100-p)*0.45)return 'meh';

var LEG={},LEG_ORDER=[];
function legDef(id,at,cond,text,opts,bg){LEG[id]={id:id,at:at,cond:cond,t:text,o:opts,bg:bg||''};LEG_ORDER.push(id);}
function legScene(id){
 var L=LEG[id],c=[];
 for(var i=0;i<L.o.length;i++){var o=L.o[i];if(o.req&&!o.req())continue;c.push(ch(o.n,'legGo',{l:id,i:i}));}
 return scene(L.t,'',{bg:L.bg||S.p.spot,kind:'event',ch:c,tag:'野史'});
}
NODES.legGo=function(a){
 var L=LEG[a.l],o=L.o[a.i];S.flags['leg_'+a.l]=S.day;
 var fx={days:o.days||2,st:{},rel:{}};
 if(o.st)for(var k in o.st)fx.st[k]=o.st[k];
 if(o.rel)for(k in o.rel)fx.rel[k]=o.rel[k];
 if(o.gold)fx.st.gold=-o.gold;
 var ok=true,t=o.t;
 if(o.chk!==undefined){ok=rollD(o.chk+S.p.st[o.ch||'zhi']*(o.cw||0));if(!ok){t=o.ft||'事情並不順利。';fx.st.rep=-1;if(o.fhp)fx.st.hp=-o.fhp;}}
 if(ok){
  if(o.love)for(var id in o.love){if(alive(id)&&LOVE[id]){loveGain(id,o.love[id]);stageUp(id);}}
  if(o.fn)o.fn();
  if(o.item){var q={};q[o.item]=1;fx.item=q;}
  if(o.bt)btRecord('legend',null,'',o.bt);
 }
 var out=applyFx(fx);
 if(S.p.st.hp<=0)return endingScene('die_hp');
 return resultScene('野史',t+fxLine(out),'',L.bg||S.p.spot,[ch('繼續','hub')]);
};
function legMonth(){
 for(var i=0;i<LEG_ORDER.length;i++){var L=LEG[LEG_ORDER[i]];
  if(S.flags['leg_'+L.id]||S.flags['legq_'+L.id])continue;
  if(!atLeast(L.at))continue;
  var okc=false;try{okc=L.cond();}catch(e){}
  if(!okc)continue;
  if(roll(38)){S.flags['legq_'+L.id]=S.day;S.pending.push(legScene(L.id));return;}
 }
}
function legCount(){var n=0;for(var k in S.flags){if(k.indexOf('leg_')===0)n++;}return n;}
